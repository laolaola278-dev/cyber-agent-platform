name: firewall-response
version: 1.0.0
description: Mock-only declarative network firewall response plugin
entrypoint: app.plugins.firewall:FirewallResponsePlugin
capabilities:
  - response.firewall
permissions:
  - response.execute
  - response.verify
  - response.rollback
approval:
  supported: true
  required: true
  subject: response-plan
rollback:
  supported: true
  actions:
    - REMOVE
    - DISABLE
    - RESTORE
health_check: true
audit_events: true
sandbox_compatible: true
operational_documentation: plugins/response/firewall/README.md
security:
  provider: mock-firewall
  database_access: false
  incident_write: false
  asset_write: false
  report_write: false
  network_access: false
  production_access: false
  shell_execute: false
  filesystem_write: false
runtime_version: phase-18
sandbox: {name: firewall-response-default, cpu_millicores: 250, memory_mb: 128, filesystem_writable: false, network_enabled: false, allowed_networks: [], environment: {}, secret_references: [], timeout_seconds: 60, working_directory: /workspace, readonly_mounts: [], tmp_mounts: [{target: /tmp, size_mb: 32}]}
worker: {runtime_version: phase-18, max_concurrency: 4, heartbeat_seconds: 30, lease_ttl_seconds: 120}
secret: {provider: memory, references: []}
network: {enabled: false, allowlist: []}
filesystem: {writable: false, working_directory: /workspace, readonly_mounts: [], tmp_mounts: [{target: /tmp, size_mb: 32}]}
healthcheck: {enabled: true, interval_seconds: 30}
