name: fake-response
version: 1.0.0
description: Non-destructive Phase 14 Response Framework certification plugin
entrypoint: app.response.fake_plugin:FakeResponsePlugin
capabilities:
  - response.notify
  - response.ticket
  - response.block
  - response.isolate
  - response.rollback
  - response.custom
permissions:
  - response.execute
  - response.verify
  - response.rollback
approval:
  supported: true
  subject: response-plan
rollback:
  supported: true
health_check: true
audit_events: true
sandbox_compatible: true
operational_documentation: plugins/response/synthetic/README.md
security:
  database_access: false
  incident_write: false
  asset_write: false
  report_write: false
  network_access: false
  destructive_action: false
runtime_version: phase-18
sandbox: {name: response-synthetic-default, cpu_millicores: 250, memory_mb: 128, filesystem_writable: false, network_enabled: false, allowed_networks: [], environment: {}, secret_references: [], timeout_seconds: 60, working_directory: /workspace, readonly_mounts: [], tmp_mounts: [{target: /tmp, size_mb: 32}]}
worker: {runtime_version: phase-18, max_concurrency: 8, heartbeat_seconds: 30, lease_ttl_seconds: 120}
secret: {provider: memory, references: []}
network: {enabled: false, allowlist: []}
filesystem: {writable: false, working_directory: /workspace, readonly_mounts: [], tmp_mounts: [{target: /tmp, size_mb: 32}]}
healthcheck: {enabled: true, interval_seconds: 30}
