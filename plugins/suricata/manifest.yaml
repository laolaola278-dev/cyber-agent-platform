name: suricata-detection
version: 1.0.0
sdk_version: 1.0.0
description: Governed Suricata Detection Plugin consuming only Adapter-validated EVE JSON.
entrypoint: app.plugins.suricata:SuricataDetectionPlugin
permissions:
  - detection.execute
  - evidence.read
capabilities:
  - network.detect
  - ids.detect
  - traffic.detect
  - event.detect
  - ioc.detect
  - rule.detect
tool: suricata
security:
  arbitrary_paths: false
  database_access: false
  incident_creation: false
  eve_json_only: true
  sandbox_required: true
runtime_version: phase-18
sandbox: {name: suricata-default, cpu_millicores: 500, memory_mb: 256, filesystem_writable: false, network_enabled: false, allowed_networks: [], environment: {}, secret_references: [], timeout_seconds: 30, working_directory: /workspace, readonly_mounts: [], tmp_mounts: [{target: /tmp, size_mb: 64}]}
worker: {runtime_version: phase-18, max_concurrency: 4, heartbeat_seconds: 30, lease_ttl_seconds: 90}
secret: {provider: memory, references: []}
network: {enabled: false, allowlist: []}
filesystem: {writable: false, working_directory: /workspace, readonly_mounts: [], tmp_mounts: [{target: /tmp, size_mb: 64}]}
healthcheck: {enabled: true, interval_seconds: 30}
