[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyber-agent-platform-backend"
version = "1.0.0-rc1"
description = "Cyber Agent Platform control plane backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.13.2,<2.0.0",
  "asyncpg>=0.29.0,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "pydantic-settings>=2.5.2,<3.0.0",
  "pydantic>=2.9.2,<3.0.0",
  "playwright>=1.49.0,<2.0.0",
  "prometheus-client>=0.21.0,<1.0.0",
  "opentelemetry-api>=1.28.0,<2.0.0",
  "opentelemetry-sdk>=1.28.0,<2.0.0",
  "opentelemetry-exporter-otlp-proto-http>=1.28.0,<2.0.0",
  "redis>=5.1.1,<6.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "uvicorn[standard]>=0.30.6,<1.0.0",
  "zaproxy>=0.6.0,<1.0.0",
  "cloudpickle>=3.1.0,<4.0.0",
  "lxml>=5.3.0,<7.0.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20.0,<1.0.0",
  "black>=26.3.1,<27.0.0",
  "httpx>=0.27.2,<1.0.0",
  "minio>=7.2.0,<8.0.0",
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "pytest-timeout>=2.3.1,<3.0.0",
  "ruff>=0.6.9,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# "ASYNC" (flake8-async) is omitted deliberately: it targets trio/anyio
# conventions (e.g. `timeout` param shadowing, blocking subprocess/pathlib).
# This codebase is asyncio-based and performs blocking IO via
# asyncio.to_thread(...) -- the correct asyncio pattern -- so those rules
# produce false positives.
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: tests that require a real PostgreSQL server (Phase 28.3 certification)",
  "object_store: tests that require a real S3-compatible object store (MinIO)",
  "sandbox: tests that exercise the real isolation sandbox provider",
  "oci: tests that require a real OCI container runtime (Phase 28.5)",
  "browser: tests that require a real Chromium (Playwright)",
  "security: adversarial security tests (network/secret/fs isolation)",
  "certification: tests that are REQUIRED for the Phase 28.5-L Linux release certification",
  "benchmark: throughput / correctness benchmarks (Phase 28.4/28.5)",
  "stress: high-iteration concurrency stress tests (Phase 28.5-RC race hardening)",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  # aiosqlite.Connection.__del__ emits a ResourceWarning when a connection is
  # garbage-collected before .close(); the raw sqlite3.Connection it wraps
  # emits "unclosed database" the same way. SQLAlchemy's create_async_engine
  # does a dialect-initialization "first connect" whose aiosqlite connection
  # runs in a background worker thread and is not cleanly closed, so both are
  # reclaimed by __del__ during a later gc.collect() (automatic cyclic GC
  # under allocation churn). This is a third-party (SQLAlchemy + aiosqlite)
  # teardown defect: the engines ARE disposed at session end
  # (conftest._dispose_module_engines), so this only silences the spurious
  # __del__ warning, not a real leak.
  "ignore:.*deleted before being closed.*:ResourceWarning:aiosqlite",
  "ignore:unclosed database:ResourceWarning",
]

