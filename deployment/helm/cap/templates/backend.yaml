apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cap.fullname" . }}-backend
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cap.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cap.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: {{ include "cap.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: APP_ENVIRONMENT
              value: production
            # the image installs the app as a wheel; config/ lives at /app/config
            - name: CONFIG_DIRECTORY
              value: /app/config
            - name: API_DOCS_ENABLED
              value: "false"
            - name: DEBUG
              value: "false"
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.logLevel | quote }}
            - name: METRICS_ENABLED
              value: {{ .Values.backend.env.metricsEnabled | quote }}
            - name: TRACING_ENABLED
              value: {{ .Values.backend.env.tracingEnabled | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.backend.env.otelServiceName | quote }}
            - name: OTEL_EXPORTER_ENDPOINT
              value: {{ .Values.backend.env.otelExporterEndpoint | quote }}
          envFrom:
            - secretRef:
                name: {{ required "backend.existingSecret is required" .Values.backend.existingSecret }}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: {{ .Values.backend.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: {{ .Values.backend.probes.readiness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: {{ .Values.backend.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.backend.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cap.fullname" . }}-backend
  labels:
    {{- include "cap.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "cap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
