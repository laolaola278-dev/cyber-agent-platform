apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cap.fullname" . }}-frontend
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cap.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cap.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: frontend
    spec:
      serviceAccountName: {{ include "cap.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      # Phase 28.6: fast failover off unreachable/not-ready nodes
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: BACKEND_UPSTREAM
              value: {{ printf "%s-backend" (include "cap.fullname" .) | quote }}
            - name: CAP_DEFAULT_USER
              value: {{ .Values.frontend.defaultUser | quote }}
            - name: RBAC_TRUSTED_PROXY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "frontend.existingSecret is required" .Values.frontend.existingSecret }}
                  key: RBAC_TRUSTED_PROXY_SECRET
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cap.fullname" . }}-frontend
  labels:
    {{- include "cap.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "cap.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
