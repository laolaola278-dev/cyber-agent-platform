{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cap.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "cap.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cap.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      # Use the namespace default ServiceAccount: a pre-install hook runs
      # BEFORE the chart's regular ServiceAccounts are created, so referencing
      # the chart SA here fails on a fresh cluster ("serviceaccount not found").
      # A DB migration needs no Kubernetes API access.
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
          env:
            - name: APP_ENVIRONMENT
              value: production
            - name: CONFIG_DIRECTORY
              value: /app/config
          envFrom:
            - secretRef:
                name: {{ required "backend.existingSecret is required" .Values.backend.existingSecret }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
{{- end }}
