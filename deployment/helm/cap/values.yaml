nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 2
  image:
    repository: ghcr.io/example/cap-backend
    tag: "1.0.0-rc1"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  existingSecret: cap-runtime
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  env:
    logLevel: INFO
    metricsEnabled: "true"
    tracingEnabled: "true"
    otelServiceName: cyber-agent-platform
    otelExporterEndpoint: ""
  probes:
    startup:
      failureThreshold: 30
      periodSeconds: 5
    readiness:
      periodSeconds: 10
      failureThreshold: 3
    liveness:
      periodSeconds: 20
      failureThreshold: 3

frontend:
  replicaCount: 2
  image:
    repository: ghcr.io/example/cap-frontend
    tag: "1.0.0-rc1"
    pullPolicy: IfNotPresent
  service:
    port: 80
  defaultUser: read-only
  existingSecret: cap-runtime
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: cap.example.com
  tls: []

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false

podDisruptionBudget:
  enabled: true
  minAvailable: 1

migration:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600

serviceAccount:
  create: true
  name: ""
