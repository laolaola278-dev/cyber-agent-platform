name: CI

on:
  workflow_call:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The two live Actions/API checks in test_release_publication_gate.py read other
    # workflows' runs and artifacts, which is an Actions API read: with only the
    # workflow-level `contents: read` they skipped in CI exactly as they do locally,
    # and the gate's live read path went unvalidated (batch-1 remote validation, §F).
    # A job-level `permissions` block *replaces* the workflow-level one rather than
    # adding to it, so `contents: read` is restated here -- without it the checkout
    # step loses its own scope. Read scopes only; nothing in this job publishes.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      # CI blind-spot governance P0 gate (docs/quality/ci-blindspot-
      # governance.md): the coverage matrix must stay self-consistent —
      # any promised capability registering a verification gap must carry
      # an inline accountability anchor, otherwise this job fails before
      # dependencies install (fail-fast, stdlib only, mirrors the inline
      # chart-defaults assertion precedent in the packaging job).
      - name: Assert coverage-matrix discipline
        run: python scripts/quality/assert_coverage_matrix.py
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --project backend --frozen --extra dev
      - name: Lint
        run: uv run --project backend ruff check backend/app backend/tests benchmarks/phase22 scripts
      - name: Unit tests and coverage
        # Exclude the Linux/container certification suite (network/reaper/
        # resources/secrets/sandbox_image): those tests need the cap-sandbox-*
        # images + cap-sandbox-egress network that only the CAP certification
        # workflow provisions. --timeout=300 catches any hang with a thread stack
        # dump instead of letting the whole job time out.
        #
        # Coverage is gated at 90% and measured on THIS job alone. The earlier
        # note here claimed the infra suites contribute coverage inside the CAP
        # certification workflow; they do not -- no certification pytest invocation
        # passes --cov, so lines that only execute in a container (worker_main,
        # acquisition gc, sandboxed_browser, the OCI shim/reaper, reconcile_cli)
        # appear in no denominator anywhere. Treat this number as the unit-suite
        # figure, list the low modules from
        # outputs/cert-<sha>/coverage-low-modules.json, and do not read it as the
        # product's executed share.
        #
        # The 28.2 SQLite durability benchmark is deselected because SQLite's
        # single-writer lock serializes it to 20+ min on a contended runner. It is
        # NOT re-certified by the release-tag benchmark job, contrary to the earlier
        # comment: that step runs the 28.4 500-run OCI/PG durability gate, and the
        # certification layer deselects 28.2 too. Its home is `make test` (the
        # developer gate, which passes no --deselect) plus the per-release local
        # audit, whose run the release report records.
        # The two live Actions/API checks in test_release_publication_gate.py need a
        # token in the environment, not only a declared scope: CI run 35683797478 had
        # `actions: read` and still failed with gh exiting 4 ("To use GitHub CLI in a
        # GitHub Actions workflow, set the GH_TOKEN environment variable"). Set here,
        # on the one step that runs them, rather than job-wide, so no other step
        # inherits a credential it does not use. Read scopes only -- this token can
        # list runs and download artifacts, and cannot publish anything.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --project backend pytest backend/tests -p no:cacheprovider \
            --ignore=backend/tests/test_phase_28_5_linux_network.py \
            --ignore=backend/tests/test_phase_28_5_linux_reaper.py \
            --ignore=backend/tests/test_phase_28_5_linux_resources.py \
            --ignore=backend/tests/test_phase_28_5_linux_secrets.py \
            --ignore=backend/tests/test_phase_28_5_sandbox_image.py \
            --deselect=tests/test_phase_28_2_500_benchmark.py::test_500_runs_durable_no_loss_no_duplicate \
            --timeout=300 --timeout-method=thread \
            --junitxml=junit-backend.xml \
            --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Validate Alembic head
        run: uv run --project backend alembic -c backend/alembic.ini heads | tee alembic-head.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-evidence
          # Machine-readable evidence, not log text: scripts/quality/audit_junit.py
          # turns these two into the pass/fail and skip tables the release
          # certification report cites, so the report's numbers are generated
          # from the run that produced them.
          path: |
            coverage.xml
            junit-backend.xml
            alembic-head.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Console unit and flow tests
        run: npm test
      - name: Type check and production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  migration:
    # The migration chain against a real PostgreSQL server, on every push. The
    # unit suite runs on SQLite and cannot see a broken upgrade path, and "no
    # file under backend/alembic changed" is not a proof either: models and the
    # migrated schema can drift apart silently and the next deployment that runs
    # `alembic upgrade head` finds out first.
    #
    # Not gated on `alembic check`: autogenerate today reports ~60 operations of
    # *known* divergence (an orphan nullable column `agents.runtime_image`,
    # indexes that exist only in the schema, unique constraints the models express
    # as unique indexes). A gate that is red on the day it is added gets deleted
    # within a release; test_migration_catalogue.py pins the drift list instead, so
    # it is visible, attributed, and can only shrink.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: {POSTGRES_USER: cap, POSTGRES_PASSWORD: cap, POSTGRES_DB: capmigrate}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cap" --health-interval 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://cap:cap@localhost:5432/capmigrate
      # alembic's env.py imports app.config/app.database, and the repo root is not
      # on sys.path when it runs from here.
      PYTHONPATH: backend
      # The catalogue tests create and drop their own throwaway databases, so they
      # certify a fresh install without disturbing this one.
      CAP283_PG_ADMIN_DSN: postgresql://cap:cap@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - name: Install locked dependencies
        run: uv sync --project backend --frozen --extra dev
      - name: Fresh install to head
        run: |
          set -euo pipefail
          uv run --project backend alembic -c backend/alembic.ini upgrade head
          uv run --project backend alembic -c backend/alembic.ini current | tail -1
      - name: Catalogue, drift and data-preservation assertions
        run: |
          set -euo pipefail
          uv run --project backend pytest backend/tests/test_migration_catalogue.py \
            -p no:cacheprovider -q --timeout=1500
      - name: Teardown and rebuild (downgrade base, upgrade head)
        run: |
          set -euo pipefail
          uv run --project backend alembic -c backend/alembic.ini downgrade base
          uv run --project backend alembic -c backend/alembic.ini upgrade head

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      # Compose refuses to interpolate without APP_VERSION (it is a required
      # carrier written as ${APP_VERSION:?...} so a deployment can never start
      # self-reporting a version nobody built). Resolve it from the canonical
      # VERSION file rather than a literal, which is how the provenance defect
      # in .github/workflows/ci.yml survived five releases.
      - name: Resolve version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Validate Compose
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          POSTGRES_PASSWORD: ci-postgres-password
          DATABASE_URL: postgresql+asyncpg://cap:ci-postgres-password@postgres:5432/cap
          SECRET_KEY: ci-secret-key-at-least-32-characters
          JWT_SECRET: ci-jwt-secret-at-least-32-characters
          RBAC_TRUSTED_PROXY_SECRET: ci-proxy-secret-at-least-32-characters
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
          PGADMIN_DEFAULT_EMAIL: ci@example.com
          PGADMIN_DEFAULT_PASSWORD: ci-pgadmin-password
        run: docker compose config --quiet
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Validate Helm chart
        run: |
          helm lint deployment/helm/cap
          helm template cap deployment/helm/cap --namespace cap > rendered-cap.yaml
          helm package deployment/helm/cap --destination dist
      # F-41: the contract all six image coordinates share, rendered with the helm
      # that ships the chart. `helm lint` above only ever sees the chart defaults,
      # so the shapes an operator may write -- and the ones that must be refused --
      # are exercised here against the real values.schema.json. Each accepted case
      # also sets a unique repository, so the assertion is about the *rendered image
      # string* the cluster would pull rather than about a values file that parsed.
      - name: Assert every image coordinate shape renders
        run: |
          set -euo pipefail
          PATHS="backend.image worker.image frontend.image worker.sandbox.image worker.sandbox.browserImage egressProxy.image"
          DIGEST="sha256:$(printf 'ab%.0s' $(seq 1 32))"
          # The fixture has to be the shape it claims: 64 hex characters. A pair
          # printed 64 times is 128, and the chart would then be refusing the test
          # value rather than answering it, so the guard checks its own tools.
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "the fixture digest is not 64 hex: $DIGEST"; exit 1; }
          run_case() {
            local -a args=()
            for p in $PATHS; do
              args+=(--set "$p.repository=p-$p")
              for kv in "$@"; do
                case "$kv" in
                  tag)    args+=(--set "$p.tag=v9.9.9") ;;
                  notag)  args+=(--set "$p.tag=null") ;;
                  digest) args+=(--set-string "$p.digest=$DIGEST") ;;
                  nodigest) args+=(--set "$p.digest=null") ;;
                esac
              done
            done
            helm template cap deployment/helm/cap --namespace cap "${args[@]}"
          }
          expect_image() {  # $1 = rendered file, $2 = coordinate, $3 = expected reference
            grep -qF "$3" "$1" || { echo "$2: expected to render $3"; exit 1; }
          }

          run_case tag repo > tag-only.yaml
          run_case digest notag repo > digest-only.yaml
          run_case tag digest repo > both.yaml
          for p in $PATHS; do
            expect_image tag-only.yaml "$p" "p-$p:v9.9.9"
            expect_image digest-only.yaml "$p" "p-$p@$DIGEST"
            # Both given: the digest is what the cluster pulls, not the tag.
            expect_image both.yaml "$p" "p-$p@$DIGEST"
            if grep -qF "p-$p:v9.9.9" both.yaml; then
              echo "$p: rendered a tag beside a digest -- the digest must win"; exit 1
            fi
          done

          refuse() {  # $1 = label, remaining = the --set arguments that must be refused
            local label="$1"; shift
            if helm template cap deployment/helm/cap --namespace cap "$@" >/dev/null 2>&1; then
              echo "the chart accepted $label"; exit 1
            fi
          }
          for p in $PATHS; do
            refuse "$p with no tag and no digest" --set "$p.tag=null" --set "$p.digest=null"
            refuse "$p with an empty tag" --set-string "$p.tag=" --set "$p.digest=null"
            refuse "$p with an empty digest" --set "$p.tag=null" --set-string "$p.digest="
            refuse "$p with a malformed digest" --set-string "$p.digest=sha256:abc"
          done
          echo "the chart rendered the three accepted shapes and refused the unusable ones"
      # v1.0.1 PATCH-GATE 6: the chart is the shipped production template,
      # so its *rendered* security defaults are asserted here. A future edit
      # that reintroduces an empty egress address or a weak sandbox provider
      # fails CI instead of silently shipping.
      # (Deployment-template assertions are GATE 6 = Helm and GATE 7 =
      # Compose; GATE 13 is the response/service targeted test suite.)
      - name: Assert production chart defaults
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          rendered = Path("rendered-cap.yaml").read_text(encoding="utf-8")
          failures = []

          sandbox = re.search(r'- name: SANDBOX_PROVIDER\s*\n\s*value: "?([^"\n]+)"?', rendered)
          if not sandbox:
              failures.append("SANDBOX_PROVIDER env not rendered for the worker")
          elif sandbox.group(1).strip() != "kubernetes-sandbox":
              failures.append(f"worker sandbox provider is {sandbox.group(1)!r}, expected kubernetes-sandbox")

          egress = re.search(r'- name: EGRESS_PROXY_URL\s*\n\s*value: "?([^"\n]*)"?', rendered)
          if not egress:
              failures.append("EGRESS_PROXY_URL env not rendered for the worker")
          elif not egress.group(1).strip().endswith("-egress-proxy:8080"):
              failures.append(
                  f"worker EGRESS_PROXY_URL is {egress.group(1)!r}; expected the in-chart "
                  "egress-proxy Service (http://<fullname>-egress-proxy:8080)"
              )

          if "kind: NetworkPolicy" not in rendered:
              failures.append("no NetworkPolicy rendered (sandbox egress is not denied by default)")

          if re.search(r'- name: APP_ENVIRONMENT\s*\n\s*value: development', rendered):
              failures.append("chart renders APP_ENVIRONMENT=development (production template)")

          if failures:
              for item in failures:
                  print(f"FAIL: {item}")
              raise SystemExit(1)
          print("chart production defaults OK: kubernetes-sandbox + in-chart egress proxy + NetworkPolicy")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz

  image-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          buildx-version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Resolve release version
        # The canonical version source is the root VERSION file. Never hardcode
        # it here: a literal would silently mislabel every CI-built image after
        # the next release and corrupt SBOM/upgrade attribution.
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Scan repository filesystem
        # trivy-action v0.36.0 (pinned by commit SHA for supply-chain integrity)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # The two scans that used to sit here covered the only two images the
      # release published. Image scanning now happens in `release-image-builds`,
      # once per image the release actually ships -- and a build there is the
      # same script `release.yml` calls, so "CI was green" also means "all five
      # images build on a clean runner".

  # ---------------------------------------------------------------------
  # ARTIFACT-GATE 5/6/7/8 evidence, before any release exists: build every
  # image the release would publish, on a clean runner, through the same
  # script release.yml calls, and scan each one. This is the step that would
  # have failed F-7: the release graph published two of the five images built
  # here, and CI is where a build that only works on a machine with local
  # state gets caught. No push happens from CI -- `--push` is release.yml's.
  # ---------------------------------------------------------------------
  release-image-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cap-backend
            dockerfile: backend/Dockerfile
            context: backend
          - image: cap-frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - image: cap-sandbox-http
            dockerfile: backend/docker/sandbox-http/Dockerfile
            role: http
          - image: cap-sandbox-browser
            dockerfile: backend/docker/sandbox-browser/Dockerfile
            role: browser
            base-image: cap-sandbox-http
          - image: cap-egress-proxy
            dockerfile: backend/docker/egress-proxy/Dockerfile
            role: egress-proxy
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          buildx-version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Resolve release version
        id: version
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Build ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          ROLE: ${{ matrix.role }}
          BASE_IMAGE: ${{ matrix.base-image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "$BASE_IMAGE" ]]; then
            # The browser image layers on the HTTP sandbox image. On a clean
            # runner that base does not exist, which is the point: build it
            # here from this same workflow and name it, instead of inheriting
            # whatever `:latest` a developer machine happened to keep.
            #
            # The record goes under `$BASE_IMAGE.prerequisite.json`, not
            # `$BASE_IMAGE.json`: this build and the cap-sandbox-http cell's own
            # build are different builds of one image (this one uses buildx
            # because nothing here needs the local store), and both cells upload
            # the whole directory. One file name for two records is how F-34
            # looked like a content bug before it was a naming one.
            bash scripts/release/build_release_image.sh \
              --name "$BASE_IMAGE" --role http \
              --dockerfile backend/docker/sandbox-http/Dockerfile \
              --version "$VERSION" --revision "$GITHUB_SHA" \
              --out "outputs/ci-release-images/$BASE_IMAGE.prerequisite.json"
          fi
          args=(--name "$IMAGE" --dockerfile "$DOCKERFILE"
                --version "$VERSION" --revision "$GITHUB_SHA"
                --local-docker
                --out "outputs/ci-release-images/$IMAGE.json")
          if [[ -n "$ROLE" ]]; then
            args+=(--role "$ROLE")
          else
            args+=(--context "$CONTEXT")
          fi
          if [[ -n "$BASE_IMAGE" ]]; then
            args+=(--build-arg "SANDBOX_HTTP_BASE=$BASE_IMAGE:$VERSION")
          fi
          bash scripts/release/build_release_image.sh "${args[@]}"
      - name: Show what was built
        run: cat "outputs/ci-release-images/${{ matrix.image }}.json"
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:${{ steps.version.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-release-image-${{ matrix.image }}
          path: outputs/ci-release-images/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # BATCH 3 A2.1 OBSERVATION (F-44). Batch 3A made the instrument say what ran;
  # A2.1 makes what runs stop depending on the runner. The producer here is one
  # executable this repository pins by version, git commit and sha256, installed
  # to a path the job controls and then invoked *by that path* -- never through
  # `docker buildx`, whose plugin dispatch is the measurement F-44 was filed
  # over. The runner's own plugin is still read and still recorded (unscored):
  # "the pinned binary built it" is only evidence while what would otherwise
  # have built it is still on the page.
  #
  # Five images now, not one. The question A2.1 has to answer is whether the
  # pinned producer can build the whole shipped set -- including the browser
  # image, whose base is the HTTP sandbox image of *this round*, bound by that
  # round's own digest out of a local OCI layout, with no registry in the path.
  #
  # Still observation-only: no push, no login, no image tag, no registry
  # credential. The release path (`release.yml` -> `build_release_image.sh`)
  # is untouched until A2.2 is approved, and
  # `test_the_release_build_path_is_still_not_switched` is the fence that says
  # so. Installing a pinned executable is not the same as switching the release
  # onto it, and this job keeps those two facts apart.
  #
  # A MISMATCH remains a measurement, not a failure. This job goes red on a
  # build that did not succeed, on a record the instrument could not complete
  # (`--self-check`), or on evidence that is missing. A2.1's *acceptance* is the
  # set verdict in producer-set.json, which the job prints and uploads -- and
  # which nobody here quietly turns into a green tick.
  # ---------------------------------------------------------------------
  producer-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The literals the recorder reads back out of this file as
      # `configured.workflow`. A value built from a step output or an
      # expression is not a claim about the repository, so the executable's
      # path is spelled out here even though `${{ runner.temp }}` would have
      # been shorter and tidier.
      CAP_OBSERVE_BUILDER: cap3a-producer-observation
      CAP_OBSERVE_DRIVER: docker-container
      CAP_OBSERVE_BUILDKIT: moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      CAP_OBSERVE_BUILDX_PIN: scripts/release/controlled_buildx.json
      CAP_OBSERVE_BUILDX_PATH: /tmp/cap-a21-controlled-buildx/buildx
    steps:
      - uses: actions/checkout@v6
      # The same action ref, the same buildx version and the same BuildKit
      # reference the release jobs ask for. This job deliberately still runs it:
      # what it installs and what the CLI dispatches to are the runner-provided
      # half of the evidence, and F-44 is only closed when the record can show
      # both the runner's answer and the pinned one side by side.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          buildx-version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - name: Install the controlled buildx (never into a CLI plugin directory)
        run: |
          set -euo pipefail
          # Refuse the runner's own plugin paths before writing anything. The
          # point of A2.1 is that the producer is selected, not that the system
          # binary is replaced -- overwriting the directory the docker CLI
          # dispatches from would make this job a mutable machine again and
          # destroy the very evidence it is supposed to be reading.
          case "$CAP_OBSERVE_BUILDX_PATH" in
            */cli-plugins/*|*/docker-buildx)
              echo "refusing to install into a docker CLI plugin path" >&2
              exit 1
              ;;
          esac
          URL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["source"]["download_url"])' "$CAP_OBSERVE_BUILDX_PIN")"
          EXPECTED="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["integrity"]["expected"].split(":",1)[1])' "$CAP_OBSERVE_BUILDX_PIN")"
          mkdir -p "$(dirname "$CAP_OBSERVE_BUILDX_PATH")"
          curl -sSL --fail --retry 3 --max-time 900 -o "$CAP_OBSERVE_BUILDX_PATH" "$URL"
          # Hashed before it is ever executed, against the digest the repository
          # carries rather than one fetched from the server that sent the file:
          # a replaced or truncated release asset has to fail here instead of
          # becoming a build whose CLI happens to print the right version.
          echo "$EXPECTED  $CAP_OBSERVE_BUILDX_PATH" | sha256sum --check --strict
          chmod 0755 "$CAP_OBSERVE_BUILDX_PATH"
          "$CAP_OBSERVE_BUILDX_PATH" version
          # What `docker buildx` would have dispatched to on this runner, read
          # for the record and changing nothing.
          docker buildx version || echo "the runner's docker buildx did not answer"
      - name: Create the named, non-publishing observation builder
        run: |
          set -euo pipefail
          "$CAP_OBSERVE_BUILDX_PATH" create --name "$CAP_OBSERVE_BUILDER" \
            --driver "$CAP_OBSERVE_DRIVER" \
            --driver-opt "image=$CAP_OBSERVE_BUILDKIT" --use
          "$CAP_OBSERVE_BUILDX_PATH" inspect --bootstrap "$CAP_OBSERVE_BUILDER"
      - name: Build all five CAP images through that builder (untagged, unpublished)
        run: |
          set -uo pipefail
          OUT=outputs/producer-observation
          rm -rf "$OUT" && mkdir -p "$OUT"
          BX="$CAP_OBSERVE_BUILDX_PATH"
          # Every build writes down the argv it is about to run before running
          # it, then records its exit status into the same file. That is what
          # makes "the controlled executable built these bytes" a claim the
          # recorder can check rather than a sentence this script asserts about
          # itself: an argv headed `docker` is a plugin dispatch and reads as a
          # disagreement even when every declared value agrees.
          record_and_run() {
            local image="$1"; shift
            python3 - "$OUT/$image.build-command.json" "$image" "$@" <<'PY'
          import json
          import sys
          out_path, image, *argv = sys.argv[1:]
          with open(out_path, "w", encoding="utf-8") as handle:
              json.dump({"image": image, "argv": argv, "exit": None}, handle)
          PY
            local status=0
            "$@" > "$OUT/$image.build.log" 2>&1 || status=$?
            python3 - "$OUT/$image.build-command.json" "$status" <<'PY'
          import json
          import sys
          path, status = sys.argv[1], int(sys.argv[2])
          with open(path, encoding="utf-8") as handle:
              doc = json.load(handle)
          doc["exit"] = status
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(doc, handle)
          PY
            echo "$status" > "$OUT/$image.build.exit"
            echo "$image: build exit $status"
            tail -n 20 "$OUT/$image.build.log"
          }
          # The version an observation build reports is the repository's canonical version
          # plus a metadata marker, read from VERSION rather than typed here. A literal in a
          # workflow is correct only on the day it is written -- and `test_no_hardcoded_version_literal_in_build_or_packaging`
          # exists because a CI `VERSION=1.0.0-rc1` once mislabelled every CI-built image.
          OBSERVE_VERSION="$(cat VERSION)+producer-observation"
          COMMON=(--builder "$CAP_OBSERVE_BUILDER" --provenance=false --sbom=false
                  --build-arg "VERSION=${OBSERVE_VERSION}"
                  --build-arg "REVISION=$GITHUB_SHA")
          # The sandbox images build from a staged context, through the same
          # staging script the release uses: an observation of a different file
          # list would be measuring a different image.
          for role in http browser egress-proxy; do
            mkdir -p "$OUT/context-$role"
            bash backend/docker/prepare_sandbox_context.sh "$OUT/context-$role" "$role"
          done
          record_and_run cap-backend "$BX" build "${COMMON[@]}" \
            --file backend/Dockerfile \
            --metadata-file "$OUT/cap-backend.metadata.json" \
            --output "type=oci,dest=$OUT/cap-backend.oci.tar" backend
          record_and_run cap-frontend "$BX" build "${COMMON[@]}" \
            --file frontend/Dockerfile \
            --metadata-file "$OUT/cap-frontend.metadata.json" \
            --output "type=oci,dest=$OUT/cap-frontend.oci.tar" frontend
          record_and_run cap-sandbox-http "$BX" build "${COMMON[@]}" \
            --file backend/docker/sandbox-http/Dockerfile \
            --metadata-file "$OUT/cap-sandbox-http.metadata.json" \
            --output "type=oci,dest=$OUT/cap-sandbox-http.oci.tar" \
            "$OUT/context-http"
          record_and_run cap-egress-proxy "$BX" build "${COMMON[@]}" \
            --file backend/docker/egress-proxy/Dockerfile \
            --metadata-file "$OUT/cap-egress-proxy.metadata.json" \
            --output "type=oci,dest=$OUT/cap-egress-proxy.oci.tar" \
            "$OUT/context-egress-proxy"
          # The browser image layers on the HTTP sandbox image. The release binds
          # that base to a digest it has just pushed; here nothing is pushed, so
          # the base is the OCI archive this same round produced, handed to the
          # builder as a named layout *and addressed by its own manifest digest*.
          # `docker-container` cannot see the host docker store, which is exactly
          # why the existing CI dry build of this image goes through `docker
          # build` -- and why it is not the producer. Going through the pinned
          # builder with a digest-pinned local layout is what lets all five images
          # be observed under one producer without a registry appearing anywhere.
          mkdir -p "$OUT/http-layout"
          HTTP_LAYOUT="$GITHUB_WORKSPACE/$OUT/http-layout"
          HTTP_BASE_DIGEST=""
          if tar -xf "$OUT/cap-sandbox-http.oci.tar" -C "$OUT/http-layout"; then
            HTTP_BASE_DIGEST="$(python3 - "$HTTP_LAYOUT/index.json" <<'PY'
          import json
          import sys
          index = json.load(open(sys.argv[1], encoding="utf-8"))
          images = [item for item in index.get("manifests", [])
                    if (item.get("annotations") or {}).get(
                        "vnd.docker.reference.type") != "attestation-manifest"]
          print(images[0]["digest"] if len(images) == 1 else "")
          PY
          )"
          fi
          if [[ -z "$HTTP_BASE_DIGEST" ]]; then
            # No digest, no binding: the browser build is refused rather than run
            # against a base nobody can name, and the missing exit file is what
            # the final assertion reports.
            echo "cap-sandbox-browser: refused -- the same-round base digest is unreadable" >&2
            echo refuse > "$OUT/cap-sandbox-browser.build.exit"
          else
            record_and_run cap-sandbox-browser "$BX" build "${COMMON[@]}" \
              --build-arg "SANDBOX_HTTP_BASE=cap-sandbox-http" \
              --build-context "cap-sandbox-http=oci-layout://$HTTP_LAYOUT@$HTTP_BASE_DIGEST" \
              --file backend/docker/sandbox-browser/Dockerfile \
              --metadata-file "$OUT/cap-sandbox-browser.metadata.json" \
              --output "type=oci,dest=$OUT/cap-sandbox-browser.oci.tar" \
              "$OUT/context-browser"
          fi
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked dependencies
        run: uv sync --project backend --frozen --extra dev
      - name: Record the producer for each image (observe mode, never a build change)
        run: |
          set -uo pipefail
          OUT=outputs/producer-observation
          record_one() {
            local image="$1" dockerfile="$2"; shift 2
            local code=0
            uv run --project backend python scripts/release/record_build_producer.py \
              --mode observe --self-check \
              --builder "$CAP_OBSERVE_BUILDER" \
              --workflow .github/workflows/ci.yml --job producer-observation \
              --lock deployment/third-party-images.json \
              --controlled-pin "$CAP_OBSERVE_BUILDX_PIN" \
              --image "$image" \
              --build-command "$OUT/$image.build-command.json" \
              --oci-tar "$OUT/$image.oci.tar" \
              --dockerfile "$dockerfile" \
              --out "$OUT/$image.producer-evidence.json" \
              "$@" > "$OUT/$image.producer-evidence.stdout.json" || code=$?
            echo "$code" > "$OUT/$image.record.exit"
            echo "$image: recorder exit $code"
          }
          record_one cap-backend backend/Dockerfile
          record_one cap-frontend frontend/Dockerfile
          record_one cap-sandbox-http backend/docker/sandbox-http/Dockerfile
          record_one cap-egress-proxy backend/docker/egress-proxy/Dockerfile
          # No `--build-arg` here for the browser image on purpose: the base it was built on,
          # and that base's digest, are read back out of the build's recorded argv rather than
          # repeated to the recorder, which would only be the same script agreeing with itself.
          record_one cap-sandbox-browser backend/docker/sandbox-browser/Dockerfile
          for image in cap-backend cap-frontend cap-sandbox-http cap-sandbox-browser \
                       cap-egress-proxy; do
            [[ -f "$OUT/$image.producer-evidence.json" ]] || continue
            uv run --project backend python - "$OUT/$image.producer-evidence.json" <<'PY'
          import json
          import sys
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          alignment = payload["producer_alignment"]
          binaries = payload["comparison"]["buildx_binaries"]
          builder = payload["observed"]["builder"]
          print(f"{payload['image']}: {alignment['verdict']} {alignment['components']}")
          print(f"  built_with={binaries.get('built_with')} "
                f"cli_plugin={binaries.get('cli_plugin_version')} "
                f"scored_from={binaries.get('scored_buildx_from')}")
          print(f"  buildkit digest={builder.get('running_image', {}).get('digest')} "
                f"config={builder.get('config_digest')}")
          print(f"  bases={[(base.get('ref'), base.get('binding'), base.get('digest')) for base in payload['base_images'].get('bases', [])]}")
          print(f"  contract_gaps={payload.get('contract_gaps', [])}")
          PY
          done
      - name: Score the five-image set (A2.1 acceptance, not a green tick)
        run: |
          set -uo pipefail
          OUT=outputs/producer-observation
          code=0
          uv run --project backend python scripts/release/record_build_producer.py \
            --self-check --out "$OUT/producer-set.json" \
            --expected-image cap-backend --expected-image cap-frontend \
            --expected-image cap-sandbox-http --expected-image cap-sandbox-browser \
            --expected-image cap-egress-proxy \
            --combine "$OUT"/*.producer-evidence.json \
            || code=$?
          echo "$code" > "$OUT/set.exit"
          uv run --project backend python - "$OUT/producer-set.json" <<'PY'
          import json
          import sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          print("A2.1 acceptance:", doc["a2_1_acceptance"]["verdict"])
          print("authorizes A2.2:", doc["authorizes_a2_2"])
          for image in doc["expected_images"]:
              row = doc["images"].get(image) or {}
              print(f"  {image}: {row.get('status')} "
                    f"comparisons={row.get('comparisons')} "
                    f"alignment={row.get('producer_alignment')} "
                    f"build_exit={row.get('build_exit')}")
              for problem in row.get("problems") or []:
                  print(f"    - {problem}")
          for problem in doc["problems"]:
              if ":" not in problem:
                  print(f"  set: {problem}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-3a-producer-observation
          # The OCI archives stay out (hundreds of MB each, and their digests are
          # transcribed into the JSON); the records, the argv each build used, the
          # exit codes, the logs, the buildx metadata files and the set verdict
          # travel.
          path: |
            outputs/producer-observation/*.producer-evidence.json
            outputs/producer-observation/*.producer-evidence.stdout.json
            outputs/producer-observation/*.build-command.json
            outputs/producer-observation/*.build.exit
            outputs/producer-observation/*.build.log
            outputs/producer-observation/*.record.exit
            outputs/producer-observation/*.metadata.json
            outputs/producer-observation/producer-set.json
            outputs/producer-observation/set.exit
          if-no-files-found: error
      - name: Fail on a build that did not succeed or on evidence that is missing
        if: always()
        run: |
          set -uo pipefail
          OUT=outputs/producer-observation
          problems=()
          for image in cap-backend cap-frontend cap-sandbox-http cap-sandbox-browser \
                       cap-egress-proxy; do
            [[ -f "$OUT/$image.build.exit" ]] \
              || problems+=("$image: the build step never recorded an exit status")
            [[ "$(cat "$OUT/$image.build.exit" 2>/dev/null)" == "0" ]] \
              || problems+=("$image: the build did not succeed (exit $(cat "$OUT/$image.build.exit" 2>/dev/null)) -- see $image.build.log")
            [[ -f "$OUT/$image.producer-evidence.json" ]] \
              || problems+=("$image: no producer evidence was written")
            [[ "$(cat "$OUT/$image.record.exit" 2>/dev/null)" == "0" ]] \
              || problems+=("$image: the observation contract was not satisfied (exit $(cat "$OUT/$image.record.exit" 2>/dev/null)) -- see contract_gaps in $image.producer-evidence.json")
          done
          [[ -f "$OUT/producer-set.json" ]] \
            || problems+=("the five-image set was never scored")
          if (( ${#problems[@]} )); then
            # What a MISMATCH still is not: a required comparison can read
            # MISMATCH or UNKNOWN here and this job stays green, because measuring
            # a disagreement is the point of the job and the disagreement is the
            # evidence A2.1's verdict is made from. What is not survivable is a
            # build that failed or a record that could not be completed.
            for problem in "${problems[@]}"; do echo "FAIL: $problem"; done
            exit 1
          fi
          echo "five observations recorded; any MISMATCH in the set verdict is measured evidence, not a verdict"
