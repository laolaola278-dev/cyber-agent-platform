name: GA Certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ga-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CAP_K8S_STRICT: "1"
  PHASE_28_6_RUN: "32565459369"
  KIND_CLUSTER: cap-k8s
  # ABSOLUTE paths: the pytest step runs with working-directory=backend while
  # the report generator runs at the repo root -- a relative GA_REPORT_DIR
  # made the test write DR evidence under backend/outputs/ga-dr/ while the
  # generator read outputs/ga-dr/, so RPO/RTO/manifest serialized as null.
  GA_BACKUP_DIR: ${{ github.workspace }}/outputs/ga-dr/backup
  GA_REPORT_DIR: ${{ github.workspace }}/outputs/ga-dr

jobs:
  ga-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: azure/setup-helm@v4
        with: { version: v3.17.3 }

      - name: Install kind + mc (MinIO client)
        run: |
          curl -sSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x kind && sudo mv kind /usr/local/bin/
          curl -sSLo mc https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc && sudo mv mc /usr/local/bin/
          kind version && mc --version

      - name: Create Cluster A (1 control-plane + 2 workers)
        run: |
          cat > /tmp/kind-a.yaml <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
            - role: worker
          EOF
          kind create cluster --name "$KIND_CLUSTER" --config /tmp/kind-a.yaml
          kubectl get nodes -o wide

      - name: Install Cilium CNI
        run: |
          helm repo add cilium https://helm.cilium.io/
          helm install cilium cilium/cilium --namespace kube-system \
            --set operator.replicas=1 \
            --set ipam.mode=kubernetes \
            --set kubeProxyReplacement=false \
            --set cgroup.autoMount.enabled=false
          kubectl -n kube-system rollout status ds/cilium --timeout=300s

      - name: Build + load images into Cluster A
        run: |
          docker build -t cap-backend:ci -f backend/Dockerfile backend/
          docker build -t cap-frontend:ci -f frontend/Dockerfile frontend/
          bash backend/docker/build_sandbox_images.sh --with-browser
          kind load docker-image cap-backend:ci cap-frontend:ci \
            cap-sandbox-http:latest cap-sandbox-browser:latest cap-egress-proxy:latest \
            --name "$KIND_CLUSTER"

      - name: Deploy PostgreSQL + MinIO + CAP on Cluster A
        run: |
          kubectl create namespace cap-infra
          cat <<'EOF' | kubectl apply -f -
          apiVersion: v1
          kind: Service
          metadata: {name: postgres, namespace: cap-infra}
          spec:
            selector: {app: postgres}
            ports: [{port: 5432, targetPort: 5432}]
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: postgres, namespace: cap-infra}
          spec:
            replicas: 1
            selector: {matchLabels: {app: postgres}}
            template:
              metadata: {labels: {app: postgres}}
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    env:
                      - {name: POSTGRES_USER, value: cap}
                      - {name: POSTGRES_PASSWORD, value: cap}
                      - {name: POSTGRES_DB, value: cap}
                    ports: [{containerPort: 5432}]
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: minio, namespace: cap-infra}
          spec:
            selector: {app: minio}
            ports: [{port: 9000, targetPort: 9000}]
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: minio, namespace: cap-infra}
          spec:
            replicas: 1
            selector: {matchLabels: {app: minio}}
            template:
              metadata: {labels: {app: minio}}
              spec:
                containers:
                  - name: minio
                    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
                    command: ["minio", "server", "/data", "--console-address", ":9001"]
                    env:
                      - {name: MINIO_ROOT_USER, value: capadmin}
                      - {name: MINIO_ROOT_PASSWORD, value: capadmin123}
                    ports: [{containerPort: 9000}]
          EOF
          kubectl -n cap-infra rollout status deployment/postgres --timeout=300s
          kubectl -n cap-infra rollout status deployment/minio --timeout=300s
          kubectl create namespace cap
          kubectl -n cap create secret generic cap-runtime \
            --from-literal=DATABASE_URL=postgresql+asyncpg://cap:cap@postgres.cap-infra.svc:5432/cap \
            --from-literal=SECRET_KEY=cap-k8s-secret-key-at-least-32-characters \
            --from-literal=JWT_SECRET=cap-k8s-jwt-secret-at-least-32-characters \
            --from-literal=RBAC_TRUSTED_PROXY_SECRET=cap-k8s-proxy-secret-at-least-32 \
            --from-literal=OBJECT_STORE_BACKEND=s3 \
            --from-literal=OBJECT_STORE_ENDPOINT=minio.cap-infra.svc:9000 \
            --from-literal=OBJECT_STORE_ACCESS_KEY=capadmin \
            --from-literal=OBJECT_STORE_SECRET_KEY=capadmin123 \
            --from-literal=OBJECT_STORE_BUCKET=cap-evidence
          helm install cap deployment/helm/cap --namespace cap \
            --timeout 600s \
            --set backend.image.repository=cap-backend --set backend.image.tag=ci \
            --set frontend.image.repository=cap-frontend --set frontend.image.tag=ci \
            --set worker.image.repository=cap-backend --set worker.image.tag=ci \
            --set backend.replicaCount=3 \
            --set worker.replicaCount=2 \
            --set worker.sandbox.egressProxyUrl=http://cap-cap-egress-proxy.cap.svc:8080 \
            --set worker.sandbox.namespace=cap-sandbox
          kubectl -n cap rollout status deploy/cap-cap-backend --timeout=600s
          kubectl -n cap rollout status deploy/cap-cap-worker --timeout=600s
          # Production defaults everywhere (deny-by-default URL policy, 60s
          # lease TTL). The RUNNING-snapshot fixture toggles the two explicit
          # TEST-ONLY hooks (ACQ_ALLOW_PRIVATE / CAP_EGRESS_ALLOW) itself,
          # scoped to just that one snapshot, then scales workers to zero.
          # Runs 32570760110/32571948457 proved cluster-wide hooks are wrong:
          # dataset runs would enter real sandbox execution (>240s worst case)
          # and never terminal inside the fixture's wait window.

      - name: Install backend deps (dev extra for pytest)
        run: uv sync --project backend --frozen --extra dev

      # the test module itself performs: dataset -> backup -> DESTROY Cluster A
      # -> fresh Cluster B -> restore -> integrity/idempotency/RUNNING-recovery
      # validation -> corruption scenarios -> measured RPO/RTO
      - name: "Run GA certification gates (strict: SKIP=FAIL)"
        working-directory: backend
        run: |
          # JUnit goes to the REPO ROOT outputs dir (the generator reads it there)
          mkdir -p ../outputs/cap-cert-ga
          uv run pytest tests/test_phase_28_7_ga_pregate_heartbeat.py \
            tests/test_phase_28_7_ga_certification.py \
            tests/test_phase_28_7_reconciliation_unit.py \
            tests/test_phase_28_7_ga_tier2_cluster.py \
            -p no:cacheprovider --timeout=3600 --tb=short -vv \
            --junitxml=../outputs/cap-cert-ga/junit-ga.xml

      # Gates 20-23/29 certify in the PARALLEL supply-chain job; its JUnit +
      # evidence artifacts must be on this runner before the generator runs.
      - uses: actions/download-artifact@v4
        if: always()
        with:
          name: supply-chain-evidence
          path: outputs/cap-cert-ga/
          continue-on-error: true

      - name: Generate GA certification artifact
        if: always()
        run: |
          mkdir -p outputs/cap-cert-ga
          python scripts/certification/generate_report_28_7.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga-cert-artifacts
          path: |
            outputs/cap-cert-ga/
            outputs/ga-dr/

  # GA-GATE 20..23 + 29: image digests, SBOM, Trivy blocking policy,
  # provenance attestation, machine-readable SLI contract. Runs WITHOUT a
  # kind cluster so supply-chain certification never blocks on (and is never
  # blocked by) the DR job's cluster lifecycle.
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Install syft + trivy (pinned)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin v1.18.1
          curl -sSLo trivy.deb \
            https://github.com/aquasecurity/trivy/releases/download/v0.58.2/trivy_0.58.2_Linux-64bit.deb
          sudo dpkg -i trivy.deb
          syft version && trivy --version

      - name: Build release images
        run: |
          docker build -t cap-backend:ci -f backend/Dockerfile backend/
          docker build -t cap-frontend:ci -f frontend/Dockerfile frontend/
          bash backend/docker/build_sandbox_images.sh --with-browser

      - name: "Run supply-chain gates (GA-GATE 20..23 + 29)"
        working-directory: backend
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p ../outputs/cap-cert-ga
          uv run pytest tests/test_phase_28_7_ga_tier2_supply_chain.py \
            -p no:cacheprovider --timeout=1800 --tb=short -vv \
            --junitxml=../outputs/cap-cert-ga/junit-supply-chain.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain-evidence
          path: outputs/cap-cert-ga/
