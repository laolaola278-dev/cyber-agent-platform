name: Release

on:
  push:
    tags:
      - "v1.0.0"
      - "v1.0.0-rc*"

permissions:
  contents: write
  packages: write

jobs:
  quality-gates:
    uses: ./.github/workflows/ci.yml

  validate-tag:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease_flag: ${{ steps.version.outputs.prerelease_flag }}
      notes_file: ${{ steps.version.outputs.notes_file }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # GA tags (no -rc suffix) publish as full releases; rc tags as prereleases.
          case "$version" in
            *-rc*) echo "prerelease_flag=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *)     echo "prerelease_flag=" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "notes_file=docs/releases/v${version}.md" >> "$GITHUB_OUTPUT"

  release-images:
    needs: validate-tag
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/cap-${{ matrix.component }}:${{ needs.validate-tag.outputs.version }}
          build-args: |
            VERSION=${{ needs.validate-tag.outputs.version }}
            REVISION=${{ github.sha }}

  release-chart:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: |
          helm lint deployment/helm/cap
          helm package deployment/helm/cap --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-assets
          path: |
            dist/*.tgz
            CHANGELOG.md
            ${{ needs.validate-tag.outputs.notes_file }}
            docs/known-issues.md

  publish-release:
    needs: [validate-tag, release-images, release-chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-assets
          path: release-assets
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            ${{ needs.validate-tag.outputs.prerelease_flag }} \
            --title "Cyber Agent Platform $GITHUB_REF_NAME" \
            --notes-file "${{ needs.validate-tag.outputs.notes_file }}" \
            release-assets/dist/*.tgz \
            release-assets/CHANGELOG.md \
            "release-assets/${{ needs.validate-tag.outputs.notes_file }}" \
            release-assets/docs/known-issues.md
      - run: |
          echo "Artifacts are release outputs only."
          echo "Architect approval and all Production Entry Gates remain mandatory."
