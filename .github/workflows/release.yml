name: Release

on:
  push:
    tags:
      # Every release tag, not a hardcoded version list: the previous filter
      # ("v1.0.0", "v1.0.0-rc*") silently failed to fire for v1.0.1-rc1 -- a
      # pushed tag that triggered nothing. The validate-tag job below is the
      # guard: it aborts unless the tag equals the VERSION file exactly, so a
      # stray tag cannot publish. -rc tags publish as prereleases, GA tags as
      # full releases.
      - "v*"

permissions:
  contents: write
  packages: write
  # `verify-certification` below reads OTHER workflows' runs through the Actions
  # REST API. Once any scope is declared, the undeclared ones become `none`, so
  # the read scope has to be stated rather than assumed.
  actions: read

jobs:
  quality-gates:
    uses: ./.github/workflows/ci.yml

  validate-tag:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease_flag: ${{ steps.version.outputs.prerelease_flag }}
      notes_file: ${{ steps.version.outputs.notes_file }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # GA tags (no -rc suffix) publish as full releases; rc tags as prereleases.
          case "$version" in
            *-rc*) echo "prerelease_flag=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *)     echo "prerelease_flag=" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "notes_file=docs/releases/v${version}.md" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # PUBLICATION GATE. A tag may not publish artefacts for certification it
  # does not have. Until this job existed the claim lived only in a comment
  # ("release jobs depend on cap-production-certification") that nothing
  # enforced, so `release.yml` would have built and published images from an
  # uncertified commit without noticing. F-21.
  #
  # What counts as certified, per the documented release policy: a completed,
  # successful run of every certification workflow whose release jobs ran -- for
  # THIS commit, or for the nearest ancestor of it whose diff to this commit
  # scripts/release/classify_diff.py classifies as non-runtime-affecting
  # (INHERITED). Certification therefore happens before the tag is pushed; a tag
  # on a runtime change with no certification of its own fails here, which is
  # the point.
  # ---------------------------------------------------------------------
  verify-certification:
    needs: validate-tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CERT_TAG_SHA: ${{ github.sha }}
      CERT_REPOSITORY: ${{ github.repository }}
      CERT_VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The ancestor walk below needs real history, not the default depth-1
          # checkout: at depth 1 every ancestor looks uncertified.
          fetch-depth: 0
      - name: Require green certification for this commit or an inheritable ancestor
        run: |
          python3 - <<'RELEASE_GATE_PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          TAG_SHA = os.environ["CERT_TAG_SHA"]
          REPO = os.environ["CERT_REPOSITORY"]
          OUT = pathlib.Path("outputs/cap-cert-release")
          #: Workflow -> the jobs that must be present and successful in it. A
          #: green run of the Linux workflow with only its PR layer executed is
          #: not release evidence, so the job set is checked, not the run colour.
          #: `postgres-version-matrix` legs share the base name and all legs
          #: must be green; a job skipped by its `if` is absent, hence "missing".
          REQUIRED = {
              "cap-linux-certification.yml": (
                  "cap-production-certification",
                  "postgres-version-matrix",
              ),
              "cap-k8s-certification.yml": ("k8s-certification",),
              "cap-ga-certification.yml": ("ga-certification", "supply-chain"),
              "cap-ga-reliability.yml": ("reliability",),
          }
          #: How far back inheritance may reach. Past this the answer is
          #: "re-certify", never "probably still fine".
          MAX_ANCESTRY_DISTANCE = 80
          #: Runs are listed one page at a time. A full page means the search
          #: stopped somewhere, not that nothing exists beyond it, so the gate
          #: reports the difference instead of quietly flattening it.
          PAGE_SIZE = 100


          def gh(path: str) -> dict:
              # Explicit UTF-8, not text=True: see _git() in
              # scripts/release/classify_diff.py -- a locale decode turns one
              # non-ASCII byte in a run name into a crash far from its cause.
              proc = subprocess.run(
                  ("gh", "api", path), capture_output=True, encoding="utf-8"
              )
              if proc.returncode != 0:
                  raise RuntimeError(f"gh api {path} failed: {proc.stderr.strip()}")
              return json.loads(proc.stdout)


          def ancestor_chain() -> list[str]:
              proc = subprocess.run(
                  ("git", "rev-list", f"--max-count={MAX_ANCESTRY_DISTANCE}", TAG_SHA),
                  capture_output=True,
                  encoding="utf-8",
              )
              if proc.returncode != 0:
                  raise RuntimeError(f"git rev-list failed: {proc.stderr.strip()}")
              chain = [line for line in proc.stdout.split() if line]
              if not chain:
                  raise RuntimeError(f"git rev-list of {TAG_SHA[:12]} produced no commits")
              if chain[0] != TAG_SHA:
                  raise RuntimeError(
                      f"rev-list starts at {chain[0][:12]}, not the tagged commit "
                      f"{TAG_SHA[:12]} -- this checkout does not contain the tag"
                  )
              if len(chain) == 1:
                  raise RuntimeError(
                      "only the tagged commit is in this checkout, so an inherited "
                      "certification cannot be checked -- this job must check out "
                      "with fetch-depth: 0"
                  )
              return chain


          def job_conclusions(run_id: int) -> dict[str, list[str]]:
              data = gh(f"repos/{REPO}/actions/runs/{run_id}/jobs?per_page=100")
              verdicts: dict[str, list[str]] = {}
              for job in data.get("jobs") or []:
                  base = job["name"].split(" (", 1)[0]
                  verdicts.setdefault(base, []).append(job.get("conclusion"))
              return verdicts


          def completed_runs(workflow: str) -> tuple[list[dict], bool]:
              """Recent completed runs, plus a window-immune probe of the tag.
              The listing is one page: a busy workflow (the Linux certification
              runs on every push to `main`) can accumulate more completed runs
              than a page holds, which would make "not found" mean "not on the
              page". The `head_sha` query is exact and unaffected, so the tagged
              commit -- the case that matters most -- is always really checked.
              """
              page = gh(
                  f"repos/{REPO}/actions/workflows/{workflow}/runs"
                  f"?per_page={PAGE_SIZE}&status=completed"
              ).get("workflow_runs") or []
              by_id = {run["id"]: run for run in page}
              exact = gh(
                  f"repos/{REPO}/actions/workflows/{workflow}/runs"
                  f"?per_page={PAGE_SIZE}&status=completed&head_sha={TAG_SHA}"
              ).get("workflow_runs") or []
              for run in exact:
                  by_id.setdefault(run["id"], run)
              return list(by_id.values()), len(page) >= PAGE_SIZE


          def find_evidence(workflow: str, chain: list[str]) -> dict:
              """Newest commit on the chain with a run of every required job."""
              runs, window_full = completed_runs(workflow)
              wanted = REQUIRED[workflow]
              for distance, sha in enumerate(chain):
                  for run in runs:
                      if run.get("head_sha") != sha or run.get("conclusion") != "success":
                          continue
                      verdicts = job_conclusions(run["id"])
                      missing = [job for job in wanted if job not in verdicts]
                      if missing:
                          print(
                              f"  {workflow} run {run['id']} at {sha[:8]} is green "
                              f"without the release job set (missing: {missing})",
                              file=sys.stderr,
                          )
                          continue
                      return {
                          "sha": sha,
                          "distance": distance,
                          "run_id": run["id"],
                          "run_url": run.get("html_url"),
                          "runs_examined": len(runs),
                          "jobs": {job: verdicts[job] for job in wanted},
                      }
              return {"missing": True, "runs_examined": len(runs), "window_full": window_full}


          def resolve_sha(rev: str) -> str:
              """Full commit SHA, or a complaint that names the input.

              `github.sha` is always 40 characters, but the value is worth
              normalising: an abbreviated one would make `ancestor_chain` report a
              shallow checkout, and `head_sha=` only matches full SHAs.
              """
              proc = subprocess.run(
                  ("git", "rev-parse", "--verify", f"{rev}^{{commit}}"),
                  capture_output=True,
                  encoding="utf-8",
              )
              if proc.returncode != 0:
                  raise RuntimeError(
                      f"cannot resolve {rev!r} to a commit in this checkout: "
                      f"{proc.stderr.strip()}"
                  )
              return proc.stdout.strip()


          def classify(certified: str) -> tuple[bool, dict]:
              proc = subprocess.run(
                  (sys.executable, "scripts/release/classify_diff.py", certified, TAG_SHA),
                  capture_output=True,
                  encoding="utf-8",
              )
              if proc.returncode not in (0, 2):
                  raise RuntimeError(f"classifier failed: {proc.stderr.strip()}")
              return proc.returncode == 0, json.loads(proc.stdout)


          def write_evidence(payload: dict) -> None:
              OUT.mkdir(parents=True, exist_ok=True)
              (OUT / "release-certification-gate.json").write_text(
                  json.dumps(payload, indent=2) + "\n", "utf-8"
              )


          def base_payload(**extra: object) -> dict:
              payload = {
                  "tag_sha": TAG_SHA,
                  "tag_ref": os.environ.get("GITHUB_REF_NAME"),
                  "version": os.environ.get("CERT_VERSION"),
                  "required": {job: list(jobs) for job, jobs in REQUIRED.items()},
              }
              payload.update(extra)
              return payload


          def main() -> int:
              chain = ancestor_chain()
              evidence: dict[str, dict] = {}
              failures: list[str] = []
              for workflow in REQUIRED:
                  found = find_evidence(workflow, chain)
                  if found.get("missing"):
                      caveat = (
                          " -- the run listing came back full, so older evidence "
                          "cannot be ruled out: dispatch certification on this commit"
                          if found["window_full"]
                          else ""
                      )
                      failures.append(
                          f"{workflow}: no completed successful run with jobs "
                          f"{list(REQUIRED[workflow])} for this commit or any of its "
                          f"{len(chain)} nearest ancestors, in the "
                          f"{found['runs_examined']} most recent completed runs "
                          f"examined{caveat}"
                      )
                      print(f"{workflow}: NO CERTIFICATION EVIDENCE", file=sys.stderr)
                      continue
                  print(
                      f"{workflow}: run {found['run_id']} at {found['sha'][:8]} "
                      f"(+{found['distance']} commits from the tag)"
                  )
                  if found["distance"]:
                      inheritable, report = classify(found["sha"])
                      found["diff_verdict"] = report["inheritance"]
                      found["runtime_affecting"] = report["runtime_affecting"]
                      found["blocking_files"] = [
                          f["path"] for f in report["files"] if f["runtime_affecting"]
                      ]
                      if not inheritable:
                          failures.append(
                              f"{workflow}: certified at {found['sha'][:12]} but the "
                              f"{found['distance']}-commit distance to the tag is "
                              f"{report['inheritance']} ({found['blocking_files']})"
                          )
                          print(
                              f"  {report['inheritance']}: "
                              f"{', '.join(found['blocking_files'][:10])}",
                              file=sys.stderr,
                          )
                  evidence[workflow] = found

              write_evidence(
                  base_payload(
                      ancestors_considered=len(chain),
                      evidence=evidence,
                      failures=failures,
                      verdict="PASS" if not failures else "FAIL",
                  )
              )
              if failures:
                  print("\nRELEASE BLOCKED -- certification:", file=sys.stderr)
                  for reason in failures:
                      print(f"  * {reason}", file=sys.stderr)
                  return 1
              print(f"\nCertification gate PASS for {TAG_SHA[:12]}")
              return 0


          try:
              TAG_SHA = resolve_sha(TAG_SHA)
              GATE_EXIT = main()
          except (RuntimeError, KeyError, IndexError, ValueError) as error:
              # Could not decide is not the same as uncertified, and it is still
              # evidence: without this the run shows two red steps and no file
              # saying what was being looked at when the ground moved.
              write_evidence(
                  base_payload(
                      verdict="ERROR",
                      error=f"{type(error).__name__}: {error}",
                      evidence={},
                      failures=[str(error)],
                  )
              )
              print(f"certification gate could not decide: {error}", file=sys.stderr)
              raise
          raise SystemExit(GATE_EXIT)
          RELEASE_GATE_PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-certification-evidence
          path: outputs/cap-cert-release/
          if-no-files-found: error

  release-images:
    needs: [validate-tag, verify-certification]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository_owner }}/cap-${{ matrix.component }}:${{ needs.validate-tag.outputs.version }}
          build-args: |
            VERSION=${{ needs.validate-tag.outputs.version }}
            REVISION=${{ github.sha }}

  release-chart:
    needs: [validate-tag, verify-certification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: |
          helm lint deployment/helm/cap
          helm package deployment/helm/cap --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-assets
          path: |
            dist/*.tgz
            CHANGELOG.md
            ${{ needs.validate-tag.outputs.notes_file }}
            docs/known-issues.md

  publish-release:
    needs: [validate-tag, verify-certification, release-images, release-chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-assets
          path: release-assets
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            ${{ needs.validate-tag.outputs.prerelease_flag }} \
            --title "Cyber Agent Platform $GITHUB_REF_NAME" \
            --notes-file "${{ needs.validate-tag.outputs.notes_file }}" \
            release-assets/dist/*.tgz \
            release-assets/CHANGELOG.md \
            "release-assets/${{ needs.validate-tag.outputs.notes_file }}" \
            release-assets/docs/known-issues.md
      - run: |
          echo "Artifacts are release outputs only."
          echo "Certification was checked by verify-certification; architect approval"
          echo "and the remaining Production Entry Gates are human decisions on top."
