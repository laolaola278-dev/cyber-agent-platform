name: Release

on:
  push:
    tags:
      # Every release tag, not a hardcoded version list: the previous filter
      # ("v1.0.0", "v1.0.0-rc*") silently failed to fire for v1.0.1-rc1 -- a
      # pushed tag that triggered nothing. The validate-tag job below is the
      # guard: it aborts unless the tag equals the VERSION file exactly, so a
      # stray tag cannot publish. -rc tags publish as prereleases, GA tags as
      # full releases.
      - "v*"

permissions:
  contents: write
  packages: write
  # `verify-certification` below reads OTHER workflows' runs through the Actions
  # REST API. Once any scope is declared, the undeclared ones become `none`, so
  # the read scope has to be stated rather than assumed.
  actions: read

jobs:
  quality-gates:
    uses: ./.github/workflows/ci.yml

  validate-tag:
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease_flag: ${{ steps.version.outputs.prerelease_flag }}
      notes_file: ${{ steps.version.outputs.notes_file }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(tr -d '\r\n' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # GA tags (no -rc suffix) publish as full releases; rc tags as prereleases.
          case "$version" in
            *-rc*) echo "prerelease_flag=--prerelease" >> "$GITHUB_OUTPUT" ;;
            *)     echo "prerelease_flag=" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "notes_file=docs/releases/v${version}.md" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # PUBLICATION GATE. A tag may not publish artefacts for certification it
  # does not have. Until this job existed the claim lived only in a comment
  # ("release jobs depend on cap-production-certification") that nothing
  # enforced, so `release.yml` would have built and published images from an
  # uncertified commit without noticing. F-21.
  #
  # What counts as certified, per the documented release policy: a completed,
  # successful run of every certification workflow whose release jobs ran -- for
  # THIS commit, or for the nearest ancestor of it whose diff to this commit
  # scripts/release/classify_diff.py classifies as non-runtime-affecting
  # (INHERITED). Certification therefore happens before the tag is pushed; a tag
  # on a runtime change with no certification of its own fails here, which is
  # the point.
  #
  # A green job set is necessary and not sufficient (F-33): every push to `main`
  # runs `ga-certification` in development mode, where a gate with no evidence in
  # that job is PLANNED rather than failing, so the round finishes green without
  # certifying GA. An Actions run object reports no dispatch inputs either, so the
  # job colour cannot tell a full GA round from a preview. Where a workflow
  # publishes an authoritative verdict -- the GA and K8s artifacts named in
  # AUTHORITY below -- this gate reads that verdict and requires it to bind to the
  # commit of the run that produced it.
  # ---------------------------------------------------------------------
  verify-certification:
    needs: validate-tag
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CERT_TAG_SHA: ${{ github.sha }}
      CERT_REPOSITORY: ${{ github.repository }}
      CERT_VERSION: ${{ needs.validate-tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The ancestor walk below needs real history, not the default depth-1
          # checkout: at depth 1 every ancestor looks uncertified.
          fetch-depth: 0
      - name: Require green certification for this commit or an inheritable ancestor
        run: |
          python3 - <<'RELEASE_GATE_PY'
          import io
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import zipfile

          TAG_SHA = os.environ["CERT_TAG_SHA"]
          REPO = os.environ["CERT_REPOSITORY"]
          OUT = pathlib.Path("outputs/cap-cert-release")
          #: Workflow -> the jobs that must be present in it, each with nothing but a
          #: "success" conclusion. A green run of the Linux workflow with only its PR
          #: layer executed is not release evidence, so the job set is checked, not the
          #: run colour. `postgres-version-matrix` legs share the base name, so every
          #: recorded conclusion has to be a success. Measured, not assumed: a job
          #: skipped by its `if` is *present* in the jobs listing with
          #: `conclusion: "skipped"` -- it does not disappear, which is what an earlier
          #: note here claimed and what let run 35594554182 (F-42) look like evidence.
          #: Which jobs succeeded is still not what they decided -- see AUTHORITY.
          REQUIRED = {
              "cap-linux-certification.yml": (
                  "cap-production-certification",
                  "postgres-version-matrix",
              ),
              "cap-k8s-certification.yml": ("k8s-certification",),
              "cap-ga-certification.yml": ("ga-certification", "supply-chain"),
              "cap-ga-reliability.yml": ("reliability",),
          }
          #: How far back inheritance may reach. Past this the answer is
          #: "re-certify", never "probably still fine".
          MAX_ANCESTRY_DISTANCE = 80
          #: Runs are listed one page at a time. A full page means the search
          #: stopped somewhere, not that nothing exists beyond it, so the gate
          #: reports the difference instead of quietly flattening it.
          PAGE_SIZE = 100
          #: Workflow -> the artifact that holds the round's OWN verdict, and what
          #: that verdict has to say for the gate to accept it (F-33).
          #:
          #: A green `ga-certification` job is not GA certification. Every push to
          #: `main` runs that workflow with CAP_GA_STRICT=0, and in development
          #: mode a gate with no evidence in this job is PLANNED instead of failing
          #: -- so the job finishes green while its own artifact records
          #: `mode: development` and `full_ga_certified: false`. The Actions run
          #: object exposes no `inputs`, so nothing above can see which mode ran;
          #: the decision has to be read where the round wrote it.
          #: `full_ga_certified` is taken exactly as stored: recomputing it from
          #: junit or from job colours would substitute a weaker copy of the
          #: generator's own rule for the rule itself.
          AUTHORITY = {
              "cap-ga-certification.yml": {
                  "artifact": "ga-cert-artifacts",
                  "member": "cap-28.7-ga-certification.json",
                  "commit": "commit",
                  "fields": {"mode": "final-strict", "full_ga_certified": True},
                  "summary": {"failed": 0, "not_run": 0, "skipped": 0, "planned": 0},
                  "passed_all_gates": True,
              },
              "cap-k8s-certification.yml": {
                  "artifact": "k8s-cert-artifacts",
                  "member": "cap-28.6-k8s-certification.json",
                  "commit": "commit",
                  "fields": {},
                  "summary": {"failed": 0, "not_run": 0},
                  "passed_all_gates": True,
              },
          }


          class AuthorityRejected(Exception):
              """The gate read the round's own verdict and it was not "certified".

              Deliberately not a `RuntimeError`, which the bottom of this script
              reports as ERROR: "I could not look" and "I looked and it says NO"
              are different messages to whoever holds the tag, and only one of
              them is answerable by dispatching a certification round.
              """


          def gh(path: str) -> dict:
              # Explicit UTF-8, not text=True: see _git() in
              # scripts/release/classify_diff.py -- a locale decode turns one
              # non-ASCII byte in a run name into a crash far from its cause.
              proc = subprocess.run(
                  ("gh", "api", path), capture_output=True, encoding="utf-8"
              )
              if proc.returncode != 0:
                  raise RuntimeError(f"gh api {path} failed: {proc.stderr.strip()}")
              return json.loads(proc.stdout)


          def gh_bytes(path: str) -> bytes:
              """A `gh api` call whose answer is an archive rather than JSON.

              Separate from `gh()` on purpose: decoding a zip as text dies in the
              decoder instead of in the reader, and a failed download is still "the
              gate could not look", never "the artifact says uncertified".
              """
              proc = subprocess.run(("gh", "api", path), capture_output=True)
              if proc.returncode != 0:
                  detail = proc.stderr.decode("utf-8", "replace").strip()
                  raise RuntimeError(f"gh api {path} failed: {detail}")
              return proc.stdout


          def ancestor_chain() -> list[str]:
              proc = subprocess.run(
                  ("git", "rev-list", f"--max-count={MAX_ANCESTRY_DISTANCE}", TAG_SHA),
                  capture_output=True,
                  encoding="utf-8",
              )
              if proc.returncode != 0:
                  raise RuntimeError(f"git rev-list failed: {proc.stderr.strip()}")
              chain = [line for line in proc.stdout.split() if line]
              if not chain:
                  raise RuntimeError(f"git rev-list of {TAG_SHA[:12]} produced no commits")
              if chain[0] != TAG_SHA:
                  raise RuntimeError(
                      f"rev-list starts at {chain[0][:12]}, not the tagged commit "
                      f"{TAG_SHA[:12]} -- this checkout does not contain the tag"
                  )
              if len(chain) == 1:
                  raise RuntimeError(
                      "only the tagged commit is in this checkout, so an inherited "
                      "certification cannot be checked -- this job must check out "
                      "with fetch-depth: 0"
                  )
              return chain


          def job_conclusions(run_id: int) -> dict[str, list[str]]:
              data = gh(f"repos/{REPO}/actions/runs/{run_id}/jobs?per_page=100")
              verdicts: dict[str, list[str]] = {}
              for job in data.get("jobs") or []:
                  base = job["name"].split(" (", 1)[0]
                  verdicts.setdefault(base, []).append(job.get("conclusion"))
              return verdicts


          def unqualified_jobs(
              wanted: tuple[str, ...], verdicts: dict[str, list[str]]
          ) -> dict[str, list]:
              """Required jobs this run cannot stand behind, with what they recorded.

              The test is equality against ``"success"``, never membership in a
              blocklist: ``skipped``, ``failure``, ``cancelled``, ``timed_out``,
              ``action_required``, ``neutral``, ``stale``, a still-``None``
              conclusion or a value Actions invents next are all equally not a pass,
              and an empty list -- a job that was never recorded -- fails the same
              way. Matrix legs share a base name, so *all* their conclusions have to
              be a success: a run whose legs are two green and one cancelled is not
              evidence, and picking the green one would be the gate reading its own
              preference into the record. Nothing here changes which run is chosen;
              it only refuses to call an unexecuted job an executed one.
              """
              return {
                  job: verdicts.get(job) or []
                  for job in wanted
                  if not verdicts.get(job)
                  or any(conclusion != "success" for conclusion in verdicts[job])
              }


          def completed_runs(workflow: str) -> tuple[list[dict], bool]:
              """Recent completed runs, plus a window-immune probe of the tag.
              The listing is one page: a busy workflow (the Linux certification
              runs on every push to `main`) can accumulate more completed runs
              than a page holds, which would make "not found" mean "not on the
              page". The `head_sha` query is exact and unaffected, so the tagged
              commit -- the case that matters most -- is always really checked.
              """
              page = gh(
                  f"repos/{REPO}/actions/workflows/{workflow}/runs"
                  f"?per_page={PAGE_SIZE}&status=completed"
              ).get("workflow_runs") or []
              by_id = {run["id"]: run for run in page}
              exact = gh(
                  f"repos/{REPO}/actions/workflows/{workflow}/runs"
                  f"?per_page={PAGE_SIZE}&status=completed&head_sha={TAG_SHA}"
              ).get("workflow_runs") or []
              for run in exact:
                  by_id.setdefault(run["id"], run)
              return list(by_id.values()), len(page) >= PAGE_SIZE


          def find_evidence(workflow: str, chain: list[str]) -> dict:
              """Newest commit on the chain with a run of every required job."""
              runs, window_full = completed_runs(workflow)
              wanted = REQUIRED[workflow]
              passed_over: list[dict] = []
              for distance, sha in enumerate(chain):
                  for run in runs:
                      if run.get("head_sha") != sha or run.get("conclusion") != "success":
                          continue
                      verdicts = job_conclusions(run["id"])
                      missing = [job for job in wanted if job not in verdicts]
                      if missing:
                          print(
                              f"  {workflow} run {run['id']} at {sha[:8]} is green "
                              f"without the release job set (missing: {missing})",
                              file=sys.stderr,
                          )
                          continue
                      # F-42: presence is not execution. A job skipped by its `if`
                      # is listed with conclusion "skipped", so a run can be green,
                      # carry every required name, and still never have run a release
                      # gate. Passing such a run over keeps the existing walk-back
                      # policy intact -- it just no longer mistakes the colour.
                      unqualified = unqualified_jobs(wanted, verdicts)
                      if unqualified:
                          recorded = {job: verdicts[job] for job in unqualified}
                          passed_over.append(
                              {"run_id": run["id"], "sha": sha, "jobs": recorded}
                          )
                          print(
                              f"  {workflow} run {run['id']} at {sha[:8]} is green but "
                              f"did not execute its release job set successfully: "
                              f"{recorded}",
                              file=sys.stderr,
                          )
                          continue
                      return {
                          "sha": sha,
                          "distance": distance,
                          "run_id": run["id"],
                          "run_url": run.get("html_url"),
                          "runs_examined": len(runs),
                          "jobs": {job: verdicts[job] for job in wanted},
                      }
              return {
                  "missing": True,
                  "runs_examined": len(runs),
                  "window_full": window_full,
                  "ineligible": passed_over[:5],
              }


          def authoritative_artifact(workflow: str, found: dict) -> dict:
              """Read the selected run's own verdict out of the artifact it uploaded.

              Structural problems -- no artifact, two of them, an unreadable archive
              -- raise, because the gate has nothing to quote. Content problems are
              collected: a development-mode round with five PLANNED gates is three
              complaints at once, and an operator reading one at a time would rerun
              the round three times to find out.
              """
              spec = AUTHORITY[workflow]
              listing = gh(
                  f"repos/{REPO}/actions/runs/{found['run_id']}/artifacts?per_page=100"
              )
              matches = [
                  artifact
                  for artifact in listing.get("artifacts") or []
                  if artifact.get("name") == spec["artifact"]
              ]
              if len(matches) != 1:
                  raise AuthorityRejected(
                      f"run {found['run_id']} holds {len(matches)} artifacts named "
                      f"{spec['artifact']!r}; the gate needs exactly one to read the "
                      "verdict from and will not choose between them"
                  )
              artifact = matches[0]
              if artifact.get("expired"):
                  raise AuthorityRejected(
                      f"{spec['artifact']} (id {artifact.get('id')}) has expired, so "
                      "the verdict it recorded can no longer be read back"
                  )
              blob = gh_bytes(f"repos/{REPO}/actions/artifacts/{artifact['id']}/zip")
              try:
                  archive = zipfile.ZipFile(io.BytesIO(blob))
                  members = [
                      name
                      for name in archive.namelist()
                      if not name.endswith("/")
                      and name.rsplit("/", 1)[-1] == spec["member"]
                  ]
                  if len(members) != 1:
                      raise AuthorityRejected(
                          f"{spec['member']} matched {len(members)} entries inside "
                          f"{spec['artifact']}: the artifact does not hold one "
                          "unambiguous verdict file"
                      )
                  payload = json.loads(archive.read(members[0]).decode("utf-8"))
              except AuthorityRejected:
                  raise
              except (zipfile.BadZipFile, OSError, ValueError) as error:
                  # ValueError covers json.JSONDecodeError: an artifact the gate
                  # cannot parse is not a verdict it can read as agreement.
                  raise AuthorityRejected(
                      f"{spec['artifact']} (id {artifact.get('id')}) carries no "
                      f"readable {spec['member']}: {type(error).__name__}: {error}"
                  ) from error
              if not isinstance(payload, dict):
                  raise AuthorityRejected(
                      f"{spec['member']} is a {type(payload).__name__}, not the object "
                      "whose verdict fields the gate reads"
                  )

              rejects: list[str] = []
              recorded = payload.get(spec["commit"])
              if recorded != found["sha"]:
                  rejects.append(
                      f"records commit {str(recorded)[:12]!r} while the run it came "
                      f"from is {found['sha'][:12]} -- the artifact describes a "
                      "different checkout than the certification being inherited"
                  )
              for field, wanted in spec["fields"].items():
                  got = payload.get(field)
                  # Type-strict as well as equal: the stored value is the round's
                  # own decision, and 1 or "true" is not the True it recorded.
                  if got != wanted or type(got) is not type(wanted):
                      rejects.append(f"records {field}={got!r}, which is not {wanted!r}")
              summary = payload.get("gate_summary")
              if not isinstance(summary, dict):
                  rejects.append(
                      f"has no gate_summary object to read gate counts from "
                      f"(found {type(summary).__name__})"
                  )
                  summary = {}
              for key, wanted in spec["summary"].items():
                  if key not in summary:
                      rejects.append(
                          f"gate_summary has no {key} count, and the gate will not "
                          f"read an unreported count as the {wanted} it needs"
                      )
                  elif summary[key] != wanted:
                      rejects.append(f"gate_summary.{key}={summary[key]!r}, requires {wanted}")
              if spec["passed_all_gates"] and summary.get("passed") != summary.get("total"):
                  rejects.append(
                      f"gate_summary counts {summary.get('passed')} of "
                      f"{summary.get('total')} gates passed, so a gate has no PASS "
                      "behind it"
                  )
              return {
                  "artifact": spec["artifact"],
                  "artifact_id": artifact.get("id"),
                  "artifact_digest": artifact.get("digest"),
                  "member": members[0],
                  "read": {
                      spec["commit"]: recorded,
                      "gate_summary": payload.get("gate_summary"),
                      **{field: payload.get(field) for field in spec["fields"]},
                  },
                  "verdict": "PASS" if not rejects else "REJECTED",
                  "rejects": rejects,
              }


          def resolve_sha(rev: str) -> str:
              """Full commit SHA, or a complaint that names the input.

              `github.sha` is always 40 characters, but the value is worth
              normalising: an abbreviated one would make `ancestor_chain` report a
              shallow checkout, and `head_sha=` only matches full SHAs.
              """
              proc = subprocess.run(
                  ("git", "rev-parse", "--verify", f"{rev}^{{commit}}"),
                  capture_output=True,
                  encoding="utf-8",
              )
              if proc.returncode != 0:
                  raise RuntimeError(
                      f"cannot resolve {rev!r} to a commit in this checkout: "
                      f"{proc.stderr.strip()}"
                  )
              return proc.stdout.strip()


          def classify(certified: str) -> tuple[bool, dict]:
              proc = subprocess.run(
                  (sys.executable, "scripts/release/classify_diff.py", certified, TAG_SHA),
                  capture_output=True,
                  encoding="utf-8",
              )
              if proc.returncode not in (0, 2):
                  raise RuntimeError(f"classifier failed: {proc.stderr.strip()}")
              return proc.returncode == 0, json.loads(proc.stdout)


          def write_evidence(payload: dict) -> None:
              OUT.mkdir(parents=True, exist_ok=True)
              (OUT / "release-certification-gate.json").write_text(
                  json.dumps(payload, indent=2) + "\n", "utf-8"
              )


          def base_payload(**extra: object) -> dict:
              payload = {
                  "tag_sha": TAG_SHA,
                  "tag_ref": os.environ.get("GITHUB_REF_NAME"),
                  "version": os.environ.get("CERT_VERSION"),
                  "required": {job: list(jobs) for job, jobs in REQUIRED.items()},
                  "authority": {
                      workflow: dict(spec) for workflow, spec in AUTHORITY.items()
                  },
              }
              payload.update(extra)
              return payload


          def decide(evidence: dict, failures: list) -> str:
              """The one place the verdict is computed, so no signal can be ignored.

              A refusal is only as good as the line that records it: if a future edit
              dropped one `failures.append`, the gate would publish a PASS whose own
              evidence says REJECTED. So the recorded verdicts are checked against the
              failure list here, and a contradiction raises -- it becomes `ERROR`,
              which blocks publication exactly as `FAIL` does while telling the truth
              about a gate that could not keep its own story straight.
              """
              if failures:
                  return "FAIL"
              for workflow, record in evidence.items():
                  authority = record.get("authority")
                  if authority is not None and authority.get("verdict") != "PASS":
                      raise RuntimeError(
                          f"{workflow}: authority verdict {authority.get('verdict')!r} "
                          "with no failure line recorded -- the gate cannot report PASS "
                          "against evidence that says otherwise"
                      )
                  if record.get("diff_verdict", "INHERITED") != "INHERITED":
                      raise RuntimeError(
                          f"{workflow}: distance classified {record['diff_verdict']!r} "
                          "with no failure line recorded -- refusing to call that "
                          "inheritance"
                      )
              return "PASS"


          def main() -> int:
              chain = ancestor_chain()
              evidence: dict[str, dict] = {}
              failures: list[str] = []
              for workflow in REQUIRED:
                  found = find_evidence(workflow, chain)
                  if found.get("missing"):
                      caveat = (
                          " -- the run listing came back full, so older evidence "
                          "cannot be ruled out: dispatch certification on this commit"
                          if found["window_full"]
                          else ""
                      )
                      unqualified_note = ""
                      if found.get("ineligible"):
                          first = found["ineligible"][0]
                          jobs = ", ".join(
                              f"{job}={conclusions}"
                              for job, conclusions in first["jobs"].items()
                          )
                          unqualified_note = (
                              f" -- {len(found['ineligible'])} green run(s) passed over "
                              f"for not executing the release job set (newest: run "
                              f"{first['run_id']} at {first['sha'][:8]}: {jobs})"
                          )
                      failures.append(
                          f"{workflow}: no completed successful run with jobs "
                          f"{list(REQUIRED[workflow])} for this commit or any of its "
                          f"{len(chain)} nearest ancestors, in the "
                          f"{found['runs_examined']} most recent completed runs "
                          f"examined{caveat}{unqualified_note}"
                      )
                      print(f"{workflow}: NO CERTIFICATION EVIDENCE", file=sys.stderr)
                      continue
                  print(
                      f"{workflow}: run {found['run_id']} at {found['sha'][:8]} "
                      f"(+{found['distance']} commits from the tag)"
                  )
                  # A rejected artifact does not send the gate looking further back:
                  # the newest green release-scoped round is the one this release
                  # would be relying on, and if that round says it did not
                  # certify, "certified somewhere older" is not the answer.
                  if workflow in AUTHORITY:
                      try:
                          found["authority"] = authoritative_artifact(workflow, found)
                      except AuthorityRejected as rejection:
                          found["authority"] = {
                              "verdict": "REJECTED",
                              "rejects": [str(rejection)],
                          }
                      for reason in found["authority"]["rejects"]:
                          failures.append(f"{workflow}: {reason}")
                          print(f"  AUTHORITY REJECTED: {reason}", file=sys.stderr)
                      if found["authority"]["verdict"] == "PASS":
                          print(
                              f"  authority: {found['authority']['member']} "
                              f"(artifact {found['authority']['artifact_id']}) "
                              "certifies this run"
                          )
                  if found["distance"]:
                      inheritable, report = classify(found["sha"])
                      found["diff_verdict"] = report["inheritance"]
                      found["runtime_affecting"] = report["runtime_affecting"]
                      found["blocking_files"] = [
                          f["path"] for f in report["files"] if f["runtime_affecting"]
                      ]
                      if not inheritable:
                          failures.append(
                              f"{workflow}: certified at {found['sha'][:12]} but the "
                              f"{found['distance']}-commit distance to the tag is "
                              f"{report['inheritance']} ({found['blocking_files']})"
                          )
                          print(
                              f"  {report['inheritance']}: "
                              f"{', '.join(found['blocking_files'][:10])}",
                              file=sys.stderr,
                          )
                  evidence[workflow] = found

              write_evidence(
                  base_payload(
                      ancestors_considered=len(chain),
                      evidence=evidence,
                      failures=failures,
                      verdict=decide(evidence, failures),
                  )
              )
              if failures:
                  print("\nRELEASE BLOCKED -- certification:", file=sys.stderr)
                  for reason in failures:
                      print(f"  * {reason}", file=sys.stderr)
                  return 1
              print(f"\nCertification gate PASS for {TAG_SHA[:12]}")
              return 0


          try:
              TAG_SHA = resolve_sha(TAG_SHA)
              GATE_EXIT = main()
          except (RuntimeError, KeyError, IndexError, ValueError) as error:
              # Could not decide is not the same as uncertified, and it is still
              # evidence: without this the run shows two red steps and no file
              # saying what was being looked at when the ground moved.
              write_evidence(
                  base_payload(
                      verdict="ERROR",
                      error=f"{type(error).__name__}: {error}",
                      evidence={},
                      failures=[str(error)],
                  )
              )
              print(f"certification gate could not decide: {error}", file=sys.stderr)
              raise
          raise SystemExit(GATE_EXIT)
          RELEASE_GATE_PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-certification-evidence
          path: outputs/cap-cert-release/
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # F-7: the release publishes every CAP image the production chart can run.
  #
  # The chart deploys five (backend, frontend, the two sandbox images and the
  # egress proxy); this used to publish two, and the other three were referenced
  # as `:latest` -- coordinates that only ever existed on a machine that had
  # built them, so a default install died at its first acquisition. The set is
  # enforced twice: `test_release_image_completeness.py` compares the chart's
  # derived image set with this graph in CI (and a tag cannot publish past red
  # CI, because `quality-gates` is the first job), and `release-image-completeness`
  # below refuses to let a partial or unattested set reach `publish-release`.
  #
  # Four images are independent and build from a matrix cell. The browser image
  # layers on cap-sandbox-http, so it is its own job taking that image's
  # published digest -- a matrix cannot express a dependency, and a `:latest`
  # base could never say which bytes shipped.
  # ---------------------------------------------------------------------
  release-images:
    needs: [validate-tag, verify-certification]
    runs-on: ubuntu-latest
    strategy:
      # A partial image set is refused downstream either way, and the operator
      # needs to know which of the five could not be produced.
      fail-fast: false
      matrix:
        include:
          - image: cap-backend
            dockerfile: backend/Dockerfile
            context: backend
          - image: cap-frontend
            dockerfile: frontend/Dockerfile
            context: frontend
          - image: cap-sandbox-http
            dockerfile: backend/docker/sandbox-http/Dockerfile
            role: http
          - image: cap-egress-proxy
            dockerfile: backend/docker/egress-proxy/Dockerfile
            role: egress-proxy
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          buildx-version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.image }}
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          args=(--name "$IMAGE" --dockerfile "$DOCKERFILE"
                --registry "ghcr.io/$OWNER" --version "$VERSION"
                --revision "$GITHUB_SHA"
                --out "outputs/release-images/$IMAGE.json" --push)
          if [[ -n "$ROLE" ]]; then
            args+=(--role "$ROLE")
          else
            args+=(--context "$CONTEXT")
          fi
          bash scripts/release/build_release_image.sh "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-image-${{ matrix.image }}
          path: outputs/release-images/
          if-no-files-found: error

  release-sandbox-browser:
    needs: [validate-tag, verify-certification, release-images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
        with:
          buildx-version: v0.37.1
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: release-image-cap-sandbox-http
          path: outputs/release-images
      - name: Build and publish cap-sandbox-browser on the released HTTP sandbox
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # The base is the digest this release published, not a tag: the browser
          # image then states which bytes it extends, and a later rebuild of
          # cap-sandbox-http cannot silently change what shipped.
          BASE_DIGEST="$(python3 -c 'import json;print(json.load(open("outputs/release-images/cap-sandbox-http.json"))["index_digest"])')"
          test -n "$BASE_DIGEST"
          bash scripts/release/build_release_image.sh \
            --name cap-sandbox-browser \
            --dockerfile backend/docker/sandbox-browser/Dockerfile \
            --registry "ghcr.io/$OWNER" --version "$VERSION" --revision "$GITHUB_SHA" \
            --role browser \
            --build-arg "SANDBOX_HTTP_BASE=ghcr.io/$OWNER/cap-sandbox-http@${BASE_DIGEST}" \
            --out outputs/release-images/cap-sandbox-browser.json --push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-image-cap-sandbox-browser
          path: outputs/release-images/
          if-no-files-found: error

  release-image-security:
    # The published refs, not only a CI build of the same source: the tag an
    # operator pulls is the artifact. Same policy as the CI job (HIGH/CRITICAL,
    # unfixed ignored, exit 1 on a hit).
    needs: [validate-tag, release-images, release-sandbox-browser]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [cap-backend, cap-frontend, cap-sandbox-http, cap-sandbox-browser, cap-egress-proxy]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.validate-tag.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: /tmp/trivy-${{ matrix.image }}.json
      - name: Record the scan of ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          REPORT: /tmp/trivy-${{ matrix.image }}.json
        run: |
          python3 - <<'SCAN_RECORD_PY'
          import json
          import os
          import pathlib
          import sys
          from datetime import datetime, timezone

          image = os.environ["IMAGE"]
          owner = os.environ["OWNER"]
          version = os.environ["VERSION"]
          # The ref the scan is *about*: an operator pulls this string, so a
          # record of some other build proves nothing about it.
          ref = f"ghcr.io/{owner}/{image}:{version}"
          path = pathlib.Path(os.environ["REPORT"])
          if not path.is_file():
              print(
                  f"{image}: trivy wrote no report at {path}. The gate refuses a "
                  "scan it cannot read rather than taking the green step as proof.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          doc = json.loads(path.read_text(encoding="utf-8"))
          blocked = []
          total = 0
          for result in doc.get("Results") or []:
              target = result.get("Target") or image
              for vuln in result.get("Vulnerabilities") or []:
                  total += 1
                  blocked.append(
                      f"{target}:{vuln.get('PkgName')}:{vuln.get('VulnerabilityID')}"
                  )
          record = {
              "image": image,
              "ref": ref,
              "scanner": "trivy",
              "policy": {
                  "severities": ["HIGH", "CRITICAL"],
                  "ignore_unfixed": True,
                  "exit_code": "1",
              },
              "findings_total": total,
              "blocking_findings": blocked,
              "verdict": "PASS" if not blocked else "FAIL",
              "scanned_at": datetime.now(timezone.utc).isoformat(),
          }
          out = pathlib.Path("security")
          out.mkdir(exist_ok=True)
          (out / f"{image}.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          if blocked:
              # `exit-code: "1"` above should have stopped the job already; this
              # is the same claim checked against the report rather than the step.
              print(f"{image}: {len(blocked)} blocking findings", file=sys.stderr)
              for item in blocked[:20]:
                  print(f"  * {item}", file=sys.stderr)
              raise SystemExit(1)
          print(json.dumps(record, indent=2))
          SCAN_RECORD_PY
      - uses: actions/upload-artifact@v4
        with:
          name: security-${{ matrix.image }}
          path: security/
          if-no-files-found: error

  release-image-completeness:
    needs: [validate-tag, release-images, release-sandbox-browser, release-image-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: release-image-*
          path: release-image-evidence
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: security-*
          path: release-image-security
          merge-multiple: true
      - name: Require a complete, attested, digest-recorded image set
        env:
          VERSION: ${{ needs.validate-tag.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'ARTIFACT_GATE_PY'
          import json
          import os
          import pathlib
          import sys

          VERSION = os.environ["VERSION"]
          #: The five images the production chart can run. Their names are derived
          #: from the chart itself by test_release_image_completeness.py in CI; this
          #: list is what the published artifacts are checked against, so a matrix
          #: cell that produced nothing cannot pass by omission.
          EXPECTED = {
              "cap-backend": "backend",
              "cap-frontend": "frontend",
              "cap-sandbox-http": "sandbox_http",
              "cap-sandbox-browser": "sandbox_browser",
              "cap-egress-proxy": "egress_proxy",
          }
          #: A release image missing any of these is not auditable afterwards.
          REQUIRED_FIELDS = (
              "tag",
              "index_digest",
              "platform_digest_linux_amd64",
              "dockerfile_sha256",
              "context_sha256",
              "base_refs",
              "source_revision",
          )

          records: dict[str, dict] = {}
          for path in sorted(pathlib.Path("release-image-evidence").glob("*.json")):
              data = json.loads(path.read_text("utf-8"))
              records[data.get("image") or path.stem] = data

          scans: dict[str, dict] = {}
          for path in sorted(pathlib.Path("release-image-security").glob("*.json")):
              data = json.loads(path.read_text("utf-8"))
              scans[data.get("image") or path.stem] = data

          failures: list[str] = []
          for name in sorted(EXPECTED):
              record = records.get(name)
              if record is None:
                  failures.append(f"{name}: no build evidence uploaded at all")
                  continue
              if record.get("tag") != VERSION:
                  failures.append(f"{name}: tagged {record.get('tag')!r}, expected {VERSION!r}")
              if not record.get("pushed"):
                  failures.append(f"{name}: built but never published")
              for field in REQUIRED_FIELDS:
                  if not record.get(field):
                      failures.append(f"{name}: evidence is missing {field}")
              for kind in ("sbom", "provenance"):
                  if not (record.get("attestations") or {}).get(kind):
                      failures.append(f"{name}: no {kind} attestation")
              # The scan of the published ref, not of a CI build of the same
              # source: §25 lists trivy beside the digests and the attestations,
              # and a release that cannot show the scan of what an operator pulls
              # is not auditable after the fact.
              scan = scans.get(name)
              expected_ref = f"ghcr.io/{os.environ['OWNER']}/{name}:{VERSION}"
              if scan is None:
                  failures.append(f"{name}: no Trivy scan record for the published image")
              else:
                  if scan.get("ref") != expected_ref:
                      failures.append(
                          f"{name}: scan is about {scan.get('ref')!r}, not {expected_ref!r}"
                      )
                  if scan.get("verdict") != "PASS" or scan.get("blocking_findings"):
                      failures.append(
                          f"{name}: Trivy found blocking findings: "
                          f"{(scan.get('blocking_findings') or [])[:5]}"
                      )
                  record["trivy"] = scan
          unexpected = sorted(set(records) - set(EXPECTED))
          if unexpected:
              failures.append(f"evidence for images the release does not declare: {unexpected}")

          payload = {
              "version": VERSION,
              "commit": os.environ.get("GITHUB_SHA"),
              "images": {EXPECTED[k]: records[k] for k in sorted(EXPECTED) if k in records},
              "failures": failures,
              "verdict": "PASS" if not failures else "FAIL",
          }
          out = pathlib.Path("outputs/release-images")
          out.mkdir(parents=True, exist_ok=True)
          (out / f"release-images-{VERSION}.json").write_text(
              json.dumps(payload, indent=2) + "\n", "utf-8"
          )
          if failures:
              print("PUBLICATION BLOCKED -- release image set incomplete:", file=sys.stderr)
              for reason in failures:
                  print(f"  * {reason}", file=sys.stderr)
              sys.exit(1)
          print(f"release image set complete: {', '.join(sorted(EXPECTED))}")
          ARTIFACT_GATE_PY
      - name: Render the digest-pinned values file
        run: |
          python3 - <<'VALUES_PY'
          import json
          import pathlib

          merged = json.loads(next(
              path.read_text(encoding="utf-8")
              for path in pathlib.Path("outputs/release-images").glob("release-images-*.json")
          ))
          #: Every image coordinate the production chart reads -> the evidence
          #: record that pins it. `worker.image` is a second deployment of the
          #: backend artifact, and it has to appear here: the released values file
          #: exists so `helm install -f` cannot land on the chart's placeholder
          #: registry, and a missing entry would leave exactly that hole in the
          #: pods that run acquisitions.
          PATHS = {
              "backend.image": "backend",
              "worker.image": "backend",
              "frontend.image": "frontend",
              "worker.sandbox.image": "sandbox_http",
              "worker.sandbox.browserImage": "sandbox_browser",
              "egressProxy.image": "egress_proxy",
          }
          tree: dict = {}
          for dotted, key in PATHS.items():
              record = merged["images"][key]
              parts = dotted.split(".")
              node = tree
              for part in parts[:-1]:
                  node = node.setdefault(part, {})
              node[parts[-1]] = {
                  "repository": record["ref"].rsplit(":", 1)[0],
                  "tag": record["tag"],
                  "digest": record["index_digest"],
              }

          def render(node: dict, depth: int = 0) -> list:
              lines: list[str] = []
              for name, value in node.items():
                  pad = "  " * depth
                  if isinstance(value, dict):
                      lines.append(pad + name + ":")
                      lines.extend(render(value, depth + 1))
                  else:
                      text = str(value)
                      if name == "tag":
                          text = '"' + text + '"'
                      lines.append(pad + name + ": " + text)
              return lines

          header = [
              "# Generated by release.yml at publish time -- do not edit.",
              "# Every CAP image the chart deploys, with the manifest-list digest this",
              "# release recorded. F-7 is the reason: three of these five defaulted to",
              "# `:latest`, a coordinate no artifact served, so a default install died at",
              "# its first acquisition. helm upgrade -f values-release.yaml reinstalls",
              "# the bytes that were certified, not a moving tag.",
              "# version: " + merged["version"],
              "# commit: " + str(merged.get("commit")),
              "",
          ]
          target = pathlib.Path("values-release-" + merged["version"] + ".yaml")
          target.write_text("\n".join(header + render(tree)) + "\n", encoding="utf-8")
          print(target.read_text(encoding="utf-8"))
          VALUES_PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-images
          path: |
            outputs/release-images/
            values-release-*.yaml
          if-no-files-found: error

  release-chart:
    # The chart archive becomes a release asset, so it waits for the images it
    # points at: shipping a chart whose images are missing is how a fresh
    # install turns into ImagePullBackOff.
    needs: [validate-tag, verify-certification, release-image-completeness]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-images
          path: release-image-evidence
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: |
          helm lint deployment/helm/cap
          helm package deployment/helm/cap --destination dist
          # the digest-pinned values file rendered from the published digests,
          # shipped beside the chart it was generated for
          cp release-image-evidence/values-release-*.yaml dist/
      - uses: actions/upload-artifact@v4
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-assets
          path: |
            dist/*.tgz
            dist/values-release-*.yaml
            CHANGELOG.md
            ${{ needs.validate-tag.outputs.notes_file }}
            docs/known-issues.md

  publish-release:
    # Not `release-images`: that would let four of five images, or four of five
    # attestations, publish a release nobody can install.
    needs:
      - validate-tag
      - verify-certification
      - release-image-completeness
      - release-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: cap-${{ needs.validate-tag.outputs.version }}-release-assets
          path: release-assets
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            ${{ needs.validate-tag.outputs.prerelease_flag }} \
            --title "Cyber Agent Platform $GITHUB_REF_NAME" \
            --notes-file "${{ needs.validate-tag.outputs.notes_file }}" \
            release-assets/dist/*.tgz \
            release-assets/dist/values-release-*.yaml \
            release-assets/CHANGELOG.md \
            "release-assets/${{ needs.validate-tag.outputs.notes_file }}" \
            release-assets/docs/known-issues.md
      - run: |
          echo "Artifacts are release outputs only."
          echo "Certification was checked by verify-certification; architect approval"
          echo "and the remaining Production Entry Gates are human decisions on top."
