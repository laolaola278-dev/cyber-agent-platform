name: CAP Linux Certification

# Phase 28.5-CI: reproducible Linux runtime certification pipeline.
# Runner must be a REAL Linux host with a working docker daemon, cgroup v2,
# and enough memory for PostgreSQL + MinIO + Chromium.
#
# LAYERS (cost strategy):
#   PR            : unit + SQLite regression + OCI smoke + network isolation
#                   + secret audit + 20-run HA (fast subset)
#   main          : full regression + 100-run HA
#   release tag   : full adversarial certification + 500-run benchmark
#
# cap-production-certification is the release layer. What that means is owned by
# code, not by this sentence: release.yml's `verify-certification` job accepts
# this workflow as release evidence only from a run whose green job set contains
# cap-production-certification AND postgres-version-matrix, for the tagged commit
# or an inheritable ancestor of it (backend/tests/test_release_publication_gate.py
# executes that rule; docs/quality/cap-1.0.6-rc1-release-certification-2026-09-19.md
# F-21 records how many green runs it refuses). Dispatch this workflow with
# `layer: release` to produce release evidence.
# Any critical gate FAIL / critical SKIP / missing JSON field -> job FAILED.

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      layer:
        description: "Certification layer to run"
        required: true
        default: "main"
        type: choice
        options:
          - pr
          - main
          - release
  pull_request:
    branches: [main]
  push:
    branches: [main, "release/**"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # One run per ref (two kind clusters on the same ref would fight), but a run in
  # flight is NOT cancelled by a later push: certification produces an artifact
  # bound to the SHA it ran, and cancelling mid-flight yields evidence for nothing.
  # A push during a certification run queues behind it instead. `ci.yml` keeps
  # cancel-in-progress because a superseded unit-test run has no evidence value.
  group: cap-cert-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # PR / fast subset
  # ---------------------------------------------------------------------
  fast-certification:
    # `layer` used to be decorative: no job read it, so a workflow_dispatch run
    # on any ref completed green having executed nothing.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.layer == 'pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CAP_CERTIFICATION_STRICT: "1"
      CAP_CERT_OUT: outputs/cap-cert
      CAP_CERT_PREFIX: capcert-pr-${{ github.run_id }}
      CAP_SANDBOX_NETWORK: cap-sandbox-egress
      CAP_SANDBOX_IMAGE: cap-sandbox-http:latest
      EGRESS_PROXY_URL: http://capcert-pr-${{ github.run_id }}-egress:8080
      CAP_CERT_PG_DSN: postgresql+asyncpg://cap:cap@127.0.0.1:55432/cap283
      CAP283_PG_DSN: postgresql+asyncpg://cap:cap@127.0.0.1:55432/cap283
      CAP283_PG_SYNC: postgresql://cap:cap@127.0.0.1:55432/cap283
      CAP283_S3_ENDPOINT: 127.0.0.1:9000
      CAP283_S3_ACCESS: capadmin
      CAP283_S3_SECRET: capadmin123
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_USER: cap, POSTGRES_PASSWORD: cap, POSTGRES_DB: cap283 }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U cap" --health-interval 5s --health-retries 12
      # MinIO server: the vendor archived the open-source build and its community images
      # are gone from Docker Hub, so this is digest-pinned and pulled from the official
      # MinIO org on Quay. Why + how to upgrade: deployment/third-party-images.json,
      # locked by backend/tests/test_third_party_image_lock.py.
      minio:
        image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
        env: { MINIO_ROOT_USER: capadmin, MINIO_ROOT_PASSWORD: capadmin123 }
        command: server /data --console-address :9001
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Install deps
        run: uv sync --project backend --frozen --extra dev
      - name: Build sandbox images
        run: bash scripts/certification/build_images.sh
      - name: Network + egress proxy setup
        run: |
          docker network create cap-sandbox-egress
          docker build -q -t cap-egress-proxy:latest -f backend/docker/egress-proxy/Dockerfile backend/
          docker run -d --name capcert-pr-${{ github.run_id }}-egress --network cap-sandbox-egress \
            -e CAP_EGRESS_ALLOW= cap-egress-proxy:latest
      - name: OCI smoke + network isolation + secret audit
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_phase_28_5_linux_network.py \
            tests/test_phase_28_5_linux_secrets.py \
            tests/test_phase_28_5_oci_provider.py \
            tests/test_phase_28_5_oci_reaper.py \
            -m "certification or oci or security" \
            --junitxml=outputs/cap-cert/junit-security.xml -p no:cacheprovider
      - name: SQLite + PG regression subset
        working-directory: backend
        run: |
          uv run pytest \
            tests/test_phase_28_1_worker_path.py tests/test_phase_28_2_claim_fencing.py \
            tests/test_phase_28_2_cancellation.py tests/test_phase_28_3_recovery_loop.py \
            tests/test_phase_28_4_object_store.py tests/test_phase_28_4_orphan_gc.py \
            -p no:cacheprovider
      - name: 20-run HA
        working-directory: backend
        run: CAP284_HA_N=20 uv run pytest tests/test_phase_28_4_multi_worker_ha.py -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cert-artifacts-pr
          path: outputs/cap-cert/

  # ---------------------------------------------------------------------
  # main / full certification (100-run HA; no 500-run benchmark)
  # ---------------------------------------------------------------------
  full-certification:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.layer != 'pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CAP_CERTIFICATION_STRICT: "1"
      CAP_CERT_OUT: outputs/cap-cert
      CAP_CERT_PREFIX: capcert-main
      CAP_SANDBOX_NETWORK: cap-sandbox-egress
      CAP_SANDBOX_IMAGE: cap-sandbox-http:latest
      EGRESS_PROXY_URL: http://capcert-main-egress:8080
      # PG / S3 test-credentials shared with phase 28.3/28.4 tests (CAP283_* read
      # by HA/benchmark/object-store suites; asyncpg DSN must carry the password).
      CAP_CERT_PG_DSN: postgresql+asyncpg://cap:cap@127.0.0.1:55432/cap283
      CAP283_PG_DSN: postgresql+asyncpg://cap:cap@127.0.0.1:55432/cap283
      CAP283_PG_SYNC: postgresql://cap:cap@127.0.0.1:55432/cap283
      CAP283_S3_ENDPOINT: 127.0.0.1:9000
      CAP283_S3_ACCESS: capadmin
      CAP283_S3_SECRET: capadmin123
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_USER: cap, POSTGRES_PASSWORD: cap, POSTGRES_DB: cap283 }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U cap" --health-interval 5s --health-retries 12
      # MinIO server: the vendor archived the open-source build and its community images
      # are gone from Docker Hub, so this is digest-pinned and pulled from the official
      # MinIO org on Quay. Why + how to upgrade: deployment/third-party-images.json,
      # locked by backend/tests/test_third_party_image_lock.py.
      minio:
        image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
        env: { MINIO_ROOT_USER: capadmin, MINIO_ROOT_PASSWORD: capadmin123 }
        command: server /data --console-address :9001
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: uv sync --project backend --frozen --extra dev
      - name: Build images + setup
        run: |
          bash scripts/certification/build_images.sh
          bash scripts/certification/setup.sh
      - name: Preflight
        run: bash scripts/certification/preflight.sh
      - name: Security certification (network/secrets/resources/browser/reaper)
        run: bash scripts/certification/run_security.sh
      - name: 100-run HA
        run: CAP284_HA_N=100 bash scripts/certification/run_ha.sh
      - name: Full regression
        working-directory: backend
        run: |
          # --timeout=300 catches hangs with a thread stack dump instead of
          # letting the whole job time out; slow benchmark/HA tests carry an
          # explicit pytest.mark.timeout override so they are not killed.
          # The 28.2 SQLite durability benchmark is excluded here: it
          # serializes writes against SQLite's single-writer lock and is
          # runner-latency sensitive (344s on a fast runner, 20+ min on a
          # contended one); its 500-run correctness is re-certified in the
          # release-tag benchmark job.
          uv run pytest tests/test_phase_28_1_worker_path.py \
            tests/test_phase_28_2_*.py tests/test_phase_28_3_*.py tests/test_phase_28_4_*.py \
            tests/test_phase_28_5_*.py -p no:cacheprovider \
            --deselect=tests/test_phase_28_2_500_benchmark.py::test_500_runs_durable_no_loss_no_duplicate \
            --timeout=300 --timeout-method=thread \
            --durations=30 -vv --tb=long \
            --junitxml=outputs/cap-cert/junit-regression.xml
      - name: Collect artifacts
        run: bash scripts/certification/collect_artifacts.sh
      - name: Generate certification result (meta-gate check, release-blocking)
        run: |
          CAP_CERT_SECRET_SENTINEL="${CAP_CERT_SECRET_SENTINEL:-}" \
          python scripts/certification/generate_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cert-artifacts-main
          path: outputs/cap-cert/

  # ---------------------------------------------------------------------
  # release tag / production certification (RELEASE GATE)
  # ---------------------------------------------------------------------
  cap-production-certification:
    if: >-
      startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.layer == 'release')
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CAP_CERTIFICATION_STRICT: "1"
      CAP_CERT_OUT: outputs/cap-cert
      # run_id, not ref_name: a branch called release/1.0.6-rc1 puts a slash in
      # every container and network alias the prefix feeds, and Docker rejects the
      # name (`Invalid container name (capcert-rel-release/1.0.6-rc1-egress)`).
      CAP_CERT_PREFIX: capcert-rel-${{ github.run_id }}
      CAP_SANDBOX_NETWORK: cap-sandbox-egress
      CAP_SANDBOX_IMAGE: cap-sandbox-http:latest
      CAP_SANDBOX_BROWSER_IMAGE: cap-sandbox-browser:latest
      EGRESS_PROXY_URL: http://capcert-rel-${{ github.run_id }}-egress:8080
      CAP284_BENCH_N: "500"
      CAP_CERT_PG_DSN: postgresql+asyncpg://cap:cap@127.0.0.1:55432/cap283
      CAP283_PG_DSN: postgresql+asyncpg://cap:cap@127.0.0.1:55432/cap283
      CAP283_PG_SYNC: postgresql://cap:cap@127.0.0.1:55432/cap283
      CAP283_S3_ENDPOINT: 127.0.0.1:9000
      CAP283_S3_ACCESS: capadmin
      CAP283_S3_SECRET: capadmin123
      CAP284_BENCH_LAB: "40"
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env: { POSTGRES_USER: cap, POSTGRES_PASSWORD: cap, POSTGRES_DB: cap283 }
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U cap" --health-interval 5s --health-retries 12
      # MinIO server: the vendor archived the open-source build and its community images
      # are gone from Docker Hub, so this is digest-pinned and pulled from the official
      # MinIO org on Quay. Why + how to upgrade: deployment/third-party-images.json,
      # locked by backend/tests/test_third_party_image_lock.py.
      minio:
        image: quay.io/minio/minio@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
        env: { MINIO_ROOT_USER: capadmin, MINIO_ROOT_PASSWORD: capadmin123 }
        command: server /data --console-address :9001
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - run: uv sync --project backend --frozen --extra dev
      - name: Build images + setup infra (http/browser images + PG/MinIO/egress)
        run: |
          bash scripts/certification/build_images.sh
          bash scripts/certification/setup.sh
      - name: Preflight (hard requirements, exit non-zero on missing)
        run: bash scripts/certification/preflight.sh
      - name: Security certification (full adversarial)
        run: bash scripts/certification/run_security.sh
      - name: 100-run HA (kill -9 worker)
        run: CAP284_HA_N=100 bash scripts/certification/run_ha.sh
      - name: 500-run OCI correctness benchmark (release-blocking)
        run: bash scripts/certification/run_benchmark.sh
      - name: Full regression (28.1 - 28.5)
        working-directory: backend
        run: |
          uv run pytest tests/test_phase_28_1_worker_path.py \
            tests/test_phase_28_2_*.py tests/test_phase_28_3_*.py tests/test_phase_28_4_*.py \
            tests/test_phase_28_5_*.py -p no:cacheprovider \
            --deselect=tests/test_phase_28_2_500_benchmark.py::test_500_runs_durable_no_loss_no_duplicate \
            --timeout=300 --timeout-method=thread \
            --durations=30 -vv --tb=long \
            --junitxml=outputs/cap-cert/junit-regression.xml
      - name: Collect artifacts
        run: bash scripts/certification/collect_artifacts.sh
      - name: Generate certification JSON + human report (meta-gate check)
        run: |
          CAP_CERT_SECRET_SENTINEL="${CAP_CERT_SECRET_SENTINEL:-}" \
          python scripts/certification/generate_report.py
      - name: Assert machine-readable artifact exists with all gates
        env:
          CAP_EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import json
          import os
          import sys
          p = "outputs/cap-cert/cap-28.5-linux-certification.json"
          with open(p, encoding="utf-8") as fh:
              data = json.load(fh)
          required = ["container_isolation","filesystem","memory","cpu","pids",
                      "network_enforcement","ssrf_defense_in_depth","hard_cancellation",
                      "reaper","browser","secrets","real_integration"]
          missing = [g for g in required if g not in data.get("gates", {})]
          assert not missing, f"missing gates: {missing}"
          bad = [g for g, v in data["gates"].items() if v in ("NOT_RUN","SKIPPED")]
          assert not bad, f"incomplete gates: {bad}"
          failed = [g for g, v in data["gates"].items() if v == "FAIL"]
          assert not failed, f"failed gates: {failed}"
          # An artifact certifies the commit its job checked out, or it certifies
          # nothing: this used to be inferable only from run metadata.
          expected_sha = os.environ.get("CAP_EXPECTED_SHA", "").strip()
          recorded = str(data.get("commit", "")).strip()
          assert recorded and recorded != "unknown", \
              "the artifact must record the SHA it certified"
          if expected_sha:
              assert recorded == expected_sha, (
                  f"artifact records {recorded[:12]} but this job ran {expected_sha[:12]}: "
                  "evidence from another commit cannot certify this one"
              )
          assert data["sandbox_workload_isolation"] == "PASS", \
              f"sandbox_workload_isolation must be PASS, got {data.get('sandbox_workload_isolation')!r}"
          # Control-plane isolation: re-derive the per-path facts from the repo at
          # assertion time rather than pinning a verdict word in this file. The
          # rule lives in scripts/certification/generate_report.py: never PASS
          # while a shipped deployment path mounts a container-runtime socket,
          # PARTIAL when only the compose path does, NOT_CERTIFIED when the chart
          # itself does. A hard-coded string here is how the gate went stale the
          # moment compose was read too (run 35431391962).
          sys.path.insert(0, "scripts/certification")
          from generate_report import docker_socket_control_plane
          live = docker_socket_control_plane()
          reported = {key: data.get(key) for key in live}
          assert reported == live, \
              f"artifact control-plane fields disagree with the repo: {reported} != {live}"
          assert live["worker_control_plane_isolation"] != "PASS", \
              "isolation may not be claimed while a shipped deployment path mounts the socket"
          assert live["production_chart_worker_mounts_runtime_socket"] is False, \
              "RELEASE BLOCKER: the production chart worker mounts a container-runtime socket"
          assert live["compose_worker_mounts_runtime_socket"] is True, \
              "compose mounts docker.sock by design (documented limitation); if that " \
              "changed, update the docs and this gate together"
          print("release certification artifact OK")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cert-artifacts-release
          path: outputs/cap-cert/
          if-no-files-found: error

# Release publications are gated on cap-production-certification +
# postgres-version-matrix: release.yml's `verify-certification` job resolves a
# successful run of THIS workflow whose head_sha is the tagged commit or an
# inheritable ancestor of it, and no image, chart or GitHub Release is published
# before that job is green. The rule lives in that job's code and in
# backend/tests/test_certification_workflow_contract.py, not in this comment --
# the previous wording here claimed `release.yml` includes this file via
# workflow_call and lists it as a required job, which was untrue: release.yml
# calls only ci.yml, and nothing anywhere required a certification run (F-21).

  # ---------------------------------------------------------------------
  # PostgreSQL version matrix (release-certification section 6)
  #
  # "Certified on PostgreSQL" has to say *which* PostgreSQL. Neither compose nor
  # the chart pins a server version an operator must match -- both point at a
  # managed instance -- so the migration chain is executed here against the three
  # major versions a deployment is likely to run. fail-fast is off deliberately: a
  # matrix that stops at the first failure reports one version instead of all
  # three.
  postgres-version-matrix:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && inputs.layer != 'pr')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15-alpine", "16-alpine", "17-alpine"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env: {POSTGRES_USER: cap, POSTGRES_PASSWORD: cap, POSTGRES_DB: capmatrix}
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U cap" --health-interval 5s --health-retries 12
    env:
      CAP_CERTIFICATION_STRICT: "1"
      DATABASE_URL: postgresql+asyncpg://cap:cap@localhost:55432/capmatrix
      PYTHONPATH: backend
      CAP283_PG_ADMIN_DSN: postgresql://cap:cap@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - name: Install locked dependencies
        run: uv sync --project backend --frozen --extra dev
      - name: Record the server under test
        # The identity of the server this matrix cell certified is part of the
        # evidence: "the migration chain works on PostgreSQL" has to say on which.
        run: |
          set -euo pipefail
          mkdir -p outputs/cap-cert
          {
            echo "matrix_image=postgres:${MATRIX_POSTGRES}"
            uv run --project backend python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine


          async def main() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.connect() as conn:
                  version = await conn.run_sync(
                      lambda sync: sync.execute(text("SELECT version()")).scalar()
                  )
                  number = await conn.run_sync(
                      lambda sync: sync.execute(text("SHOW server_version_num")).scalar()
                  )
              await engine.dispose()
              print(f"version={version}")
              print(f"server_version_num={number}")


          asyncio.run(main())
          PY
          } > outputs/cap-cert/pg-matrix-server.txt
          cat outputs/cap-cert/pg-matrix-server.txt
        env:
          MATRIX_POSTGRES: ${{ matrix.postgres }}
      - name: Fresh install to head
        run: |
          set -euo pipefail
          uv run --project backend alembic -c backend/alembic.ini upgrade head
      - name: Catalogue, drift and data-preservation assertions
        run: |
          set -euo pipefail
          uv run --project backend pytest backend/tests/test_migration_catalogue.py \
            -p no:cacheprovider -q --timeout=1500 \
            --junitxml=outputs/cap-cert/junit-pg-matrix-${{ matrix.postgres }}.xml
      - name: Teardown and rebuild (downgrade base, upgrade head)
        run: |
          set -euo pipefail
          uv run --project backend alembic -c backend/alembic.ini downgrade base
          uv run --project backend alembic -c backend/alembic.ini upgrade head
      - name: Upload matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-matrix-${{ matrix.postgres }}
          path: outputs/cap-cert/
          if-no-files-found: warn
