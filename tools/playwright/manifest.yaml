name: playwright
version: 1.0.0
tool_type: playwright
description: Managed public-web browser adapter.
required_permissions:
  - tool.playwright
config_schema:
  type: object
  properties:
    headless:
      type: boolean
runtime_requirements:
  adapter: playwright
  capabilities:
    - crawl.html
    - browser.render
  config:
    headless: true
